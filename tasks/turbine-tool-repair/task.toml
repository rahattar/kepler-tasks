conflicts_of_interest = "I am employed by MEMC (GlobalWafers), a silicon wafer manufacturer; this task has no connection to my employer's products, processes or data. It uses only textbook gas turbine performance testing (ASME PTC 22 practice: OEM correction curves, generator loss correction, fuel heating value from gas composition) on a synthetic machine, program, records and parameters. I also author evaluation tasks for other AI benchmark programs; this task shares no data, code or scenario with them."
