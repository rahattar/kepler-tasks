schema_version = "1.4"

artifacts = ["/app/output/form.csv"]

[task]
name = "afterquery/bore-form-acceptance"
description = "Sentence the fourteen finish-machined cylinder bores, gland bores and ram journals of a hydraulic press overhaul on form and size: a minimum-zone form error and an accept or reject against each drawing, from raw measured profiles, the shop's records and a metrology room booking of four dense scans."
authors = [{ name = "Alireza Bafandeh", email = "rahattar@gmail.com" }]
keywords = [
    "dimensional-metrology",
    "form-tolerance",
    "minimum-zone",
    "gdt",
    "measurement-planning",
    "instrument-error",
]

[metadata]
author_name = "Alireza Bafandeh"
author_email = "rahattar@gmail.com"
author_organization = "MEMC"
author_profile = "https://www.linkedin.com/in/alireza-bafandeh"
research_advisor = ""
referred_by = ""
conflicts_of_interest = "I am employed by MEMC (GlobalWafers), a silicon wafer manufacturer; this task has no connection to my employer's products, processes or data. It uses only textbook dimensional metrology (reference figures for form, minimum-zone fitting, the envelope requirement and Taylor's principle, harmonic analysis of roundness profiles, filter bands and sampling, instrument error motion and thermal reference) on synthetic parts and records. I also author evaluation tasks for other AI benchmark programs; this task shares no data, code or scenario with them."
domain = "engineering-sciences"
field = "mechanical-engineering"
subfield = "dimensional metrology: form and size"
category = "Science"
subcategory = "Mechanical & Aerospace Engineering"
tags = [
    "dimensional-metrology",
    "form-tolerance",
    "minimum-zone",
    "gdt",
    "measurement-planning",
    "instrument-error",
]
expert_time_estimate_hours = 5
relevant_experience = """I am a control scientist and mechanical engineer with a PhD in mechanical engineering. Dimensional metrology of machined features, the reference figures that form tolerances are defined against, harmonic analysis of roundness profiles, what a set of measured points can and cannot settle, separating instrument error from part error, and planning the few measurements a job allows are part of my work on industrial equipment and of my teaching. The press, its features and its records are synthetic."""
difficulty_explanation = """
In practice this is a works metrology and overhaul job: a press is stripped, its bores and journals are finish-machined and measured, and someone has to put a form error and an accept or reject against each one before it is rebuilt. Its research analogue is the identification of a measured surface from raw profile data, which is where dimensional metrology is genuinely hard: the reference figure a tolerance is defined against, the band of undulation the tolerance covers, the separation of what belongs to the part from what belongs to the instrument, and what a set of points can and cannot settle. The press, its records and its metrology room are synthetic, written by authoring/provenance from a sealed definition. The deliverable is a form error in micrometres and one of four sentences for each of 14 features, and the gate is all 14.

Standard FM-7 defines the assessment: the profile of a section is its radii less the mean, orders 0 and 1 dropped and order n weighted by exp(-pi (0.4697 n / 50)^2); form is a minimum-zone value, concentric circles per section for a roundness callout and coaxial cylinders over all three sections for a cylindricity one; size is sentenced by Taylor's principle, the mating size being the largest inscribed or smallest circumscribed cylinder and a local size a diametrically opposite pair; every size is referred to 20 C. Most of that the instrument software does not do, and the inspection report shows what it does instead: a least-squares zone and a mean diameter. Taking the mean diameter for the mating size sentences 5 features wrong. Taking the mating size and stopping there, which is what a single size figure usually means, sentences 2 more wrong: two features came off the boring bar oval, and a plug gauge goes through an oval bore on its minor axis while a pair of opposite points across its major axis is over the upper limit, so those two are decided by a local size and by nothing else, one bore 6.1 um over its upper limit and one journal 10.9 um under its lower while their mating sizes are inside by 14.2 um and 4.4 um. The converse is in the data too: the lobing of two setups sits at odd orders, and a two-point size adds the radii of opposite points, so every odd order cancels in it and those features have a nearly constant two-point size however far out of round they are. Only their mating size catches them. Both halves of Taylor's principle have features that only they can sentence. Leaving the Gaussian band off, so that the finishing pass's feed waviness counts as form, misses all 14. Computing roundness where the drawing calls cylindricity misses the four cylindricity features by up to 4.5 um, because taper counts against a cylindricity zone and not against a roundness one. Not referring sizes to 20 C sentences 3 wrong. The one default that costs nothing here is the least-squares zone: FM-7 drops orders 0 and 1, which puts the least-squares centre at the origin, so on these profiles it agrees with the minimum zone to within 0.2 um. That is a property of the assessment and not of the parts, and no choice of form would change it.

Three things the records cannot settle on their own. Five features were measured only on the coordinate machine's bore program, at 12 touch points a revolution, which cannot resolve a band that runs to 50 undulations: what those points give is not a small form error but an aliased fraction of a large one, and no care taken afterwards recovers it. One bore was re-honed after it was measured, so its record describes a surface that no longer exists. That is six features for a booking of four scans. The machining log records which features were finished in one setup without unclamping, and the shop's process note PE-114 states what that means: the lobing is a property of the setup rather than of the feature, because it comes from the bar's deflection and the way the casting is held, and two features of one clamping carry the same undulations at the same amplitudes. The note is as careful about what does not carry, since all three matter here: not the angular position of the pattern, because the machine's angular reference and the instrument's are unrelated and a part is clamped wherever it comes to rest, which is why what transfers is the form error and the mating deviation and not the profile itself; not the diameter; and not the taper, which is the bar's axis against one feature's length. So a scan of one feature carries the form error and the mating deviation of the other feature of its setup, while each keeps its own size, and a cylindricity callout its own taper, from its own record. Six needs fall into four setups, and the booking covers them. Of the 1001 ways to spend the booking, 8 get all 14 features right, and the best any other does is 13. Spending one scan per sparse feature, which is what the symptoms seem to call for, needs five.

What no document gives is the instrument. A record's angle is the form tester's spindle angle and a part is clamped wherever it comes to rest, so a component that repeats in amplitude and in phase across parts bored in different setups on different machines cannot belong to the parts. The shop's tester carries its error at 23 and 29 undulations, and its records are the only place that shows it: averaging them leaves the machine and averages the parts down, and the orders to keep are those whose mean stands clear of the scatter between parts. It is not one error, though. The log has the tester's spindle bearings re-greased and its preload reset on 2026-09-30, half way through the inspection campaign, and a bearing that has been re-greased and re-preloaded does not run as it ran before. Six records are from before that day and three are from after, and as they stand in the assessment profile the two states are 14.1 um peak to valley, from 4.0 um at 23 undulations and 3.1 um at 29, and 9.2 um, from 2.7 um and 1.9 um, both orders having moved most of a radian in phase. So the separation has to be done twice, on each side of that date, once from six records and once from three. Charged to the parts instead, the error adds up to 12.1 um to a form error and sentences 7 of the 14 wrong, and nothing in the records contradicts the result: the inspection report's own figures carry the same error, so a solver that checks its work against them finds agreement. Pooled over the whole campaign it is worse than that: the two states disagree in phase, so nothing survives a significance test, the tester looks clean, and the same 7 are sentenced wrong. Taking each campaign's whole average off its own parts, rather than the orders that belong to the machine, sentences 7 wrong and is the one route that gets a feature wrong which no other route touches.
"""

solution_explanation = """
solution/solve.py is the reference; solution/solve.sh runs it in the agent's environment. It uses only /app/data and the scans it orders through `formscan`, and never reads the sealed definition.

1. **The instrument first.** The maintenance line in the machining log splits the shop tester's nine records at the day its spindle was re-greased, and each side is treated as its own machine: the assessment profiles of that side's records are averaged and the orders whose mean stands three standard errors clear of the scatter between the parts are kept. That gives orders 23 and 29 on both sides, 14.1 um peak to valley before the service and 9.2 um after, and each record has its own side's error motion subtracted. The metrology room's tester is certified, so a scan carries none of it.
2. **What needs a scan.** A record cannot carry a feature's form when it has fewer than 101 points a revolution, which cannot resolve FM-7's band to 50 UPR, or when the machining log shows work on that feature after the day it was measured. That is five under-sampled features and one re-honed bore.
3. **The booking.** Those six are grouped by the setup the machining log puts them in, and one scan is ordered per group: four scans for four groups. For a feature left unscanned, the form error and the mating deviation come from the scanned feature of its setup, both being independent of where the angular origin sits, while its mean radius and its taper come from its own record: twelve points average a radius well, and the taper is the feature's own and not the setup's. One feature is the exception that proves the rule - the setup of the re-honed bore left its lobing nowhere else, so that bore has to be scanned itself, and a hone does not correct taper, so the taper its stale record carries is still the taper it has.
4. **The assessment.** Per section: the mean radius referred to 20 C, and the deviations filtered to FM-7's band. Then, by linear programming on the deviations, which are micrometres on a radius of hundreds of millimetres: the minimum zone, concentric circles per section or coaxial cylinders over the feature with the axis free in position and tilt; the mating cylinder, largest inscribed for a bore and smallest circumscribed for a journal; and the local sizes as diametrically opposite pairs.
5. **The sentence.** A bore accepts on size when its mating size is at or above the lower limit and its worst local size at or below the upper, a journal the other way about; form accepts within tolerance; the two give accept, reject_size, reject_form or reject_both.

On the shipped records every feature is right, the worst form error being 0.20 um against a band of 1.2. The sheet is graded by the verifier's own module, on a written sheet, like everything else in the evidence.

**authoring/evidence/independent.py** is a second solution, written separately: pandas for the records, the machine's error motion found by a different test (an order belongs to the machine when its amplitude and its phase both agree across the records of one campaign, the mean resultant length of the phases being 1.00 at orders 23 and 29 with their amplitudes within a fifth of each other, against 0.53 and a factor of 2.5 or more everywhere else) with its amplitude taken as the median, the minimum zone and the mating cylinder solved as constrained problems by SLSQP rather than as linear programs, the axis parameterised by its offset at the two ends, and the other feature of each pair scanned. Its sheet goes to tests/grade_form.py run as its own process, which accepts it: all 14 right, worst form error 0.90 um. Phase agreement alone is not enough on the three records of the later campaign, where it also picks up a part order that happens to line up; requiring the amplitudes to agree as well separates them, since the machine writes the same amplitude into every record it touches and a part does not.
"""

verification_explanation = """
The deliverable is one CSV file, /app/output/form.csv, with a form error and a sentence for each of the 14 features. The verifier (tests/grade_form.py, run by tests/test_form.py under pytest) grades it against the sealed definition in tests/sealed: a feature is right when the reported form error is within 1.2 um of the minimum-zone form error of its true surface and the sentence matches exactly. The sheet is accepted only when all 14 are right.

The sheet's format is the instruction's, clause for clause, and the reader enforces it literally. "The exact header feature,form_um,verdict" is the first line of the file character for character: nothing is trimmed, so a space, a quote, a capital or a blank line above it refuses the sheet. "One row for each of the 14 features" is each feature exactly once and nothing unknown. "form_um to two decimal places" is a point with exactly two digits after it, the whole part being any digits or none, so .50 is read as 0.50: one decimal, a whole number, three decimals, an exponent, a sign, a unit or a space refuses the sheet. "One of" the four sentences is one of those four words exactly. What the instruction does not constrain is left alone: the order of the rows, LF or CRLF line ends (Python's csv module writes CRLF), a terminator on the last line, empty lines after the header, and CSV quoting of a row's fields. A sheet refused for its format scores as a sheet with no feature right. One pytest test carries the reward; test.sh writes 0 first and writes 1 only when pytest exits 0 and the ctrf report shows exactly 1 test, 1 passed. The per-feature record goes to /logs/verifier/metrics.json and never gates.

The truth comes from the sealed definition authoring/provenance/isim.py, never from running the reference, and the agent never sees it. The 1.2 um band is stated in no file the agent can read: preflight fails if it appears in the instruction or in any document under environment/data, so an answer cannot be split between two readings and aimed at it. Nothing here grades with a comparison of its own. Every study writes a complete sheet, to two decimals under the header the task asks for, and hands it to the verifier's own grading module, so what a study measures is what the verifier would decide: the same CSV reader, the same figures, the same gate. The sealed copy that module imports is byte-identical to the one the studies build from, and preflight checks that; truth() is memoised inside the studies because it is a pure function of the feature and a thousand-booking study would otherwise spend its life re-solving the same fourteen minimum-zone problems. verifier_runs.txt closes the remaining gap: it runs the whole pytest verifier, test_form.py under the command test.sh uses, in a clean subprocess on 29 complete sheets - the reference, the second solution, each defective route, no scans at all, the two best null sheets, six sheets the verifier has to refuse rather than grade, and the reference's own correct answers written eight ways, two inside the stated format and six outside it - and every one is decided as it should be, the reward coming from pytest's exit status the way test.sh takes it.

The evidence then shows the band is wide against the spread of sound methods and narrow against wrong ones; every figure below is the worst error on a reported form error, or the count of the 14 features sentenced wrong.

method_spread.txt: 192 sound runs, every booking that covers what the records cannot carry crossed with every order the four scans could be ordered in and with the mating gauge taken over the feature or section by section, all pass, the worst at 0.20 um, and no single feature is given more than 0.20 um of error by any of them. independent.txt: the second solution, 0.90 um, its sheet accepted by the verifier run as its own process. route_study.txt: 16 defective routes, and every one of the 14 features is sentenced wrong by at least 4 of them. The tester's error motion charged to the parts 12.10 um and 7 features; one error motion pooled over the whole campaign, which leaves nothing significant to subtract, 12.10 um and the same 7; each campaign's whole average taken off its own parts 5.28 um and 7; the Gaussian band left off 2.88 um and all 14; nothing removed at all 47.51 um; the mean diameter for the mating size 5 features; the mating size alone, with no two-point local size, 2; no temperature correction 3; roundness where cylindricity is called 4.50 um and 4; no scans at all 6 features; scans ordered but a setup not used to carry its twin 2; one scan per sparse feature, so the re-honed bore left out, 2. The nearest wrong route is the Gaussian band at 2.88 um, against a band of 1.2 and a sound spread of 0.20. campaign_study.txt: of the 1001 ways to spend the booking, 8 pass and the best of the rest gets 13 of 14. null_baselines.txt: the true bank is 3 accept, 4 reject_size, 4 reject_form, 3 reject_both, so no constant sentence gets more than 4 of the 14 on the sentence alone. Every sheet that names one form figure and one sentence for all 14 features is then swept through the verifier, the figure in 0.05 um steps from 0 to 60 um against each of the four sentences, 4804 sheets: the best picks up one feature. One is the floor and cannot be helped, since some constant always happens to name some feature's own form figure and its own sentence, but no sheet reaches two, because the form errors of the features sharing any one sentence are spaced at least 2.94 um apart against a band of 1.2 - so no feature can be won without doing the work, and preflight fails if that spacing is ever lost. Transcribing the inspection report's own roundness and mean diameter gets 0 of 14. hedge_study.txt: the sentence is categorical, so it admits no hedge at all, and on the choices that matter the two readings of the form error are further apart than twice the band on most features. verifier_checks.txt: 23 malformed sheets, every one rejected as a whole and none crashing the grader; 16 sheets that carry the right form error and the right sentence for all 14 features in a format the instruction does not allow - the header altered six ways, the form figures to one decimal, to none, to three, in exponent form, signed, with a unit or with a space, a sentence or a feature with a space - every one rejected, so no sheet outside the stated format passes; and the correct sheet varied six ways the instruction does not constrain, all accepted.

In the agent's container the sealed definition and the metrology room's booking records live under /opt/room, owned by the user room with mode 700. The agent reaches the room only through `formscan`, a sudo wrapper for /opt/room/lab.py admitting one command and no environment. The program validates its argument, creates one exclusive record per scan, charges the scan before it is made, refuses a feature already scanned, refuses any scan beyond the booking of 4, and refuses to run if its directories are not as installed. The agent works as a separate user that can write only to /app/output; /app/data is read-only. The verifier runs in a separate container without network, and /logs/verifier is root-only.
"""

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[agent]
timeout_sec = 28800.0
user = "agent"

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 4096
gpus = 0
network_mode = "public"
