artifacts = ["/app/output/cell_capability.csv"]

[task]
name = "afterquery/cooling-tower-capability"
description = "From a cooling tower's hourly DCS records, met station log, tag list, maintenance log, surveys and the plant's rating procedure, work out each of eight cells' thermal capability at the end of the season."
authors = [{ name = "Alireza Bafandeh", email = "rahattar@gmail.com" }]
keywords = [
    "cooling-tower",
    "merkel",
    "psychrometrics",
    "heat-and-mass-transfer",
    "flow-balance",
    "plant-data-forensics",
]

[metadata]
author_name = "Alireza Bafandeh"
author_email = "rahattar@gmail.com"
author_organization = "MEMC"
author_profile = "https://www.linkedin.com/in/alireza-bafandeh"
research_advisor = ""
referred_by = ""
conflicts_of_interest = "I am employed by MEMC (GlobalWafers), a silicon wafer manufacturer; this task has no connection to my employer's products, processes or data. It uses only textbook cooling tower thermal rating (moist-air psychrometrics, the Merkel integral, fan laws, a power-law fill characteristic) on a synthetic tower, records and parameters. I also author evaluation tasks for other AI benchmark programs; this task shares no data, code or scenario with them."
domain = "engineering-sciences"
field = "mechanical-engineering"
subfield = "cooling tower thermal performance"
category = "Science"
subcategory = "Mechanical & Aerospace Engineering"
tags = [
    "cooling-tower",
    "merkel",
    "psychrometrics",
    "heat-and-mass-transfer",
    "flow-balance",
    "plant-data-forensics",
]
expert_time_estimate_hours = 8
relevant_experience = """I am a control scientist and thermal engineer with a PhD in mechanical engineering and an undergraduate background in HVAC. Psychrometrics, evaporative cooling, heat and mass transfer in cooling equipment, and reading plant historian data against maintenance records are part of my work on industrial thermal equipment and of my teaching. The tower, its records and parameters are synthetic."""
difficulty_explanation = """A utilities or reliability engineer at a refinery, chemical plant or power station does this when deciding which cooling tower cells to refill or repair at the next outage. A cell's thermal capability, the share of its design heat and mass transfer that the fill still delivers, cannot be measured directly; it is worked out from the plant's hourly operating records with the Merkel method of the acceptance-test codes. The tower, its records and parameters here are synthetic, written by authoring/provenance from a sealed definition.

The core difficulty is that the rating is very sensitive to its inputs. The cooling a cell achieves comes from a small difference between large enthalpies of nearly saturated air, so a few tenths of a kelvin in a water temperature, a few percent in a water or air flow, or one kelvin in the entering wet bulb moves the rating by several percent of design. The procedure has to be applied hour by hour, with psychrometrics at the site's pressure, the Merkel integral, the fan-law air flow and the valid-hour rules, and each cell is wanted as it stands at the end of the season, not as an average over it.

The records cannot be taken at face value, and each problem has to be found by checking one record against another. The met station keeps UTC while the DCS keeps US Central daylight time, and four riser meters read in US gpm. The header flowmeter does not agree with the eight riser meters, and three faults hide in that one difference: C3's riser meter reads about 150 m3/h with no flow at all, which only the two weeks its riser was blanked off for the fill replacement reveal; C6's meter reads 15 percent high from June; and C1's freeze-protection bypass, logged only as found passing, sends about 240 m3/h of header water past the fill into C1's basin, water that C1's riser meter never sees and that warms C1's weir reading. C1 can be rated only after the bypass flow is recovered from the header balance and taken out of its weir temperature, and that needs C3's and C6's meter errors removed first. C5's cold-water sensor sits in the common outlet flume, so it reads the flow-weighted mean of all eight basins, the bypass water included. C2's replacement hot-water thermocouple reads 2 K high, C4's replacement motor reports 20 percent less power at the same speed, C8 drew plume air back into its inlet in westerly wind, as the 2025 survey found, until its fan stack was extended in June, and no longer does, C3's fill was replaced in July, and C7's fill fouls steadily, so its end-of-season value lies well below its seasonal median. Missing any one of these puts at least one cell 5 to 40 percentage points off, or leaves no valid hours (authoring/evidence/route_study.txt), against a requirement of 3."""

solution_explanation = """solution/solve.py follows TP-31 hour by hour. The met records are moved 5 h earlier (UTC to CDT) and joined to the DCS hours; the C1-C4 riser flows, tagged US gpm, are divided by 4.402868. Flows (corrected_flows()): C3's meter zero is its median reading while its riser was blanked off, 2026-07-06 to 07-20 14:00 (150 m3/h), subtracted throughout; the header balance (risers minus header) is searched for its single step (2026-06-01 00:00), the riser whose reading jumps at that hour is C6, and its readings from then are divided by 1 + step/(reading - step) (1.150); the bypass flow is then header minus the corrected risers as a 25-hour rolling median (600 m3/h until 04-14, 241 m3/h after). C2's hot-water reading from 2026-06-20 is lowered by the change in its offset from the median of the other seven risers. C4's power from 2026-06-15 is divided by the change in its power per speed cubed per air density relative to the median of the other fans (0.803). C5's cold water is backed out of its flume reading: total flow (risers plus bypass) times the reading, minus each other weir's flow times its temperature, with C1's weir flow including the bypass, divided by C5's flow. C1's fill outlet temperature is ((q1 + B) t_weir - B t_hot) / q1. The wet bulb comes from dry bulb, RH and the measured pressure; C8's entering wet bulb is 2.0 K higher with the wind from 225-315 degrees until its stack extension (2026-06-24 15:00); after it no correction is applied, and C8's westerly hours rate within 0.2 percentage points of its others (solve.py prints the comparison before and after the stack). Valid hours: fan at 60 percent or more, wind 4.5 m/s or less, C3 from 2026-07-20 14:00. Each hour gives C = KaV/L (L/G)^0.65, with KaV/L by Simpson's rule (40 intervals) and G from the fan law; a straight line through the weekly medians of C (weeks with 10 hours or more), read at the last hour of the record and divided by C_d = 1.4001, is the capability. The largest miss on the shipped tower is 0.5 percentage points (C5)."""

verification_explanation = """tests/grade_cells.py reads /app/output/cell_capability.csv, and the single pytest test passes only when it has the columns cell and capability_pct with one row for each of C1-C8 and nothing else, finite values, each within 3 percentage points of the sealed capability (tests/ct2.py, CAPABILITY; authoring/evidence/calibration.txt recomputes the eight values from the sealed definition and agrees exactly). The misses per cell are written to /logs/verifier/metrics.json and do not affect the reward. The verifier neither runs the solution nor reads /app/data.

Why 3 percentage points (authoring/evidence). Correct side: independent.py is a second implementation written apart from the reference and sharing no code with it (IAPWS-IF97 saturation pressure, Newton wet bulb, Gauss-Legendre Merkel integral, the met clock converted through the America/Chicago time zone, C3's zero as a trimmed mean of its blanked-off hours, C6's error by least squares on the header balance, a 12-hour mean bypass flow, C2 against its neighbours, C4 from full-speed hours, a Theil-Sen line through daily medians for the end of the season); its largest miss is 1.2 pp (independent.txt). Changing the reference's end-of-season estimate, bypass smoothing, source of C3's zero, C2 reference, integration intervals or fault windows keeps it within 1.5 pp (method_spread.txt). Wrong side: each record trap on its own puts at least one cell 5.0 pp or more off (route_study.txt: the met clock at standard time 5.0, the seasonal median for C7 5.4, C3's old fill kept 5.5, C8's recirculation kept after the stack 7.6, sea-level pressure 6.2, C4's power 12.5, C2's thermocouple 12.8, C5's flume reading 15.1, C3's meter zero 16.6, the met clock unshifted 19.8, the C1 bypass 22.0, the wind filter 22.8, C6's meter by subtraction 32.1 or trusted 37.1, dry bulb for wet bulb 39.9; gpm left unconverted leaves no valid hours); leaving out C8's recirculation altogether is not a trap (1.3 pp), because the end of the record falls after the stack was extended. The bound therefore sits between 1.5 pp for sound methods and 5.0 pp for the nearest trap. The true values are irregular: one value for every cell satisfies at most 3 of 8, and the procedure applied to the records as they stand satisfies one (constant_null.txt).

The agent works as a separate user that can only write to /app/output; /app/data is read-only. The verifier runs separately without network, and /logs/verifier is root-only."""

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[agent]
timeout_sec = 10800.0
user = "agent"

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 4096
gpus = 0
network_mode = "public"
