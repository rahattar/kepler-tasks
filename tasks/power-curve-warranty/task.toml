artifacts = ["/app/output/pp12.py"]

[task]
name = "afterquery/power-curve-warranty"
description = "Write a program that verifies the power curve warranty of a wind farm's turbines with nacelle anemometry (IEC 61400-12-2) from SCADA, met mast and farm records, and that stays right on farm-period packages it has never seen."
authors = [{ name = "Alireza Bafandeh", email = "rahattar@gmail.com" }]
keywords = [
    "wind-energy",
    "power-performance-testing",
    "nacelle-anemometry",
    "iec-61400-12",
    "scada-data-validation",
    "engineering-software",
]

[metadata]
author_name = "Alireza Bafandeh"
author_email = "rahattar@gmail.com"
author_organization = "MEMC"
author_profile = "https://www.linkedin.com/in/alireza-bafandeh"
research_advisor = ""
referred_by = ""
conflicts_of_interest = "I am employed by MEMC (GlobalWafers), a silicon wafer manufacturer; this task has no connection to my employer's products, processes or data. It uses only published wind turbine power performance practice (IEC 61400-12-1 and 61400-12-2, nacelle transfer functions, Annex A disturbed sectors, air density normalisation) on synthetic farms, turbines and records. I also author evaluation tasks for other AI benchmark programs; this task shares no data, code or scenario with them."
domain = "engineering-sciences"
