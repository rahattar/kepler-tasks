[task]
name = "afterquery/chill-bench-commissioning"
description = "Commission sixteen newly installed vacuum wafer chill stations from a fixed budget of eight bench runs, half the number of stations."
authors = [{ name = "Alireza Bafandeh", email = "rahattar@gmail.com" }]
