[task]
name = "afterquery/slab-cooling-dispatch"
description = "Write the supervisory controller for two radiant-slab office zones on one chiller: keep unmeasured operative temperature in band at low electricity cost over eight hidden summer weeks."
authors = [{ name = "Alireza Bafandeh", email = "rahattar@gmail.com" }]
