schema_version = "1.4"

artifacts = ["/app/output/preheat.py"]

[task]
name = "afterquery/weld-preheat-temperature"
description = "Write a program that finds the minimum preheat of a butt-welded joint against hydrogen cracking and HAZ hardening from its plate certificates, consumable batches, arc monitor records, electrode oven, climate and shop logs, and that stays right on joints it has never seen."
authors = [{ name = "Alireza Bafandeh", email = "rahattar@gmail.com" }]
keywords = [
    "welding",
    "preheat",
    "hydrogen-cracking",
    "haz-hardness",
    "heat-input",
    "engineering-software",
]

[metadata]
author_name = "Alireza Bafandeh"
author_email = "rahattar@gmail.com"
author_organization = "MEMC"
author_profile = "https://www.linkedin.com/in/alireza-bafandeh"
research_advisor = ""
referred_by = ""
conflicts_of_interest = "I am employed by MEMC (GlobalWafers), a silicon wafer manufacturer; this task has no connection to my employer's products, processes or data. It uses only published welding engineering (the EN 1011-2 hydrogen cracking and cooling time methods, a published HAZ hardness relation, the arc energy of waveform-controlled welding and the moisture pick-up of covered electrodes) on synthetic joints and records. I also author evaluation tasks for other AI benchmark programs; this task shares no data, code or scenario with them."
domain = "engineering-sciences"
field = "mechanical-engineering"
subfield = "welding engineering and heat transfer"
category = "Science"
