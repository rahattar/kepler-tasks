[task]
name = "afterquery/flange-torque-spec"
description = "Specify the assembly torque for each of sixteen flanged bolted joints so that every bolt ends up at its target preload after the crew's tightening sequence, using eight trial slots on a rig, the fastener handbook and the records of two earlier assemblies."
authors = [{ name = "Alireza Bafandeh", email = "rahattar@gmail.com" }]
keywords = [
    "bolted-joints",
    "torque-tension",
    "flange-assembly",
    "fastener-engineering",
    "test-planning",
    "tightening-sequence",
]

[metadata]
author_name = "Alireza Bafandeh"
author_email = "rahattar@gmail.com"
author_organization = "MEMC"
author_profile = "https://www.linkedin.com/in/alireza-bafandeh"
research_advisor = ""
referred_by = ""
conflicts_of_interest = "I am employed by MEMC (GlobalWafers), a silicon wafer manufacturer; this task has no connection to my employer's products, processes or data. It uses only textbook bolted-joint engineering (torque-tension relation, nut factors, proof loads, thread tolerances, flange bolt patterns and tightening sequences) on synthetic joints, fasteners and records. I also author evaluation tasks for other AI benchmark programs; this task shares no data, code or scenario with them."
domain = "engineering-sciences"
