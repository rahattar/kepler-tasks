conflicts_of_interest = "I am employed by MEMC (GlobalWafers), a silicon wafer manufacturer; this task has no connection to my employer's products, processes or data. It uses only textbook machine design (interference fits after DIN 7190, Lame thick cylinders, surface smoothing, thermal and centrifugal effects on fits, friction of shrink-fitted joints) on synthetic joints, materials and records. I also author evaluation tasks for other AI benchmark programs; this task shares no data, code or scenario with them."
