relevant_experience = """I am a control scientist and thermal engineer with a PhD in mechanical engineering. Vacuum and gas-handling systems of crystal growth and thermal processing equipment, identifying their models from operating records, and the fault diagnosis that turns those records into maintenance decisions are part of my work on industrial equipment and of my teaching. The chambers and records are synthetic."""
difficulty_explanation = """In practice this is the work of a vacuum process engineer auditing a shop's chambers: naming what limits each one's
base pressure and quantifying it, so that the shutdown can be planned around the chambers worth opening. The
engineer has the chambers' own records and a single contractor's test that has to be ordered before its result is
known. Its research analogue is the identification of vacuum systems from operating data: the steady gas balance p =
Q / S_eff of a lumped volume, water desorption from chamber walls and its temperature dependence, permeation of
atmospheric gas through elastomer seals and the composition it admits, the emptying of a trapped volume, gas
corrections for nitrogen-calibrated gauges, and residual gas analysis read as a mixture of sources.

The chambers and records are synthetic, written by `authoring/provenance` (`bpphys.py`, `fleet.py`, `docs_bp.py`,
`build.py`) from a sealed definition. They are realistic in their numbers:
- Chambers of 900 to 5200 L, on turbomolecular pumps of 360 to 1480 L/s through ports of 420 to 2600 L/s.
- Effective pumping speeds of 124 to 943 L/s.
- Elastomer seals of 150 to 900 cm, in fluoroelastomer, nitrile and perfluoroelastomer.
- Turbo controllers reporting rotor frequency, drive power and bearing temperature weekly, against the maker's
  figures for a pump of that model in order.
- Internal surfaces of 2.6 to 11 m2, electropolished, machined or bead blasted, with anodised aluminium shields.
- Wall gas load coefficients of 0.45 to 2.6 times the outgassing table's nominal figure.
- Real air leaks of 7 x 10^-6 to 4 x 10^-4 mbar L/s.
- Trapped volumes emptying with time constants of 14 and 24 h.
- Total gas loads of 6.4 x 10^-5 to 8.3 x 10^-4 mbar L/s, and base pressures of 2.2 x 10^-7 to 1.7 x 10^-6 mbar,
  every one of them above the chamber's specified base pressure.
- Four to seven recent pumpdowns per chamber, of 12 to 24 h, over 2026-07-02 to 2026-10-30, in a shop whose air runs
  from 27 C in July to 13 C in October, with gauge readings repeatable to 0.6 per cent.

The reference condition is the same for every chamber: 36 h from the start of roughing after an air vent, the
chamber wall at 20 C, nothing in the chamber. That is longer than every pumpdown in the base-pressure log (the
longest is 24 h), so no entry can be read across to it: every chamber's gas load is the sum of mechanisms that
extrapolate differently in pumping time and temperature, and only a budget identified across the chamber's own
entries reaches the reference condition. Each chamber's limiting cause is the mechanism with the largest gas load
there, except that a chamber whose actual speed is below 0.75 of its rated speed is limited by its pump whatever its
gas load is doing.

The example chamber, VC00, has sound records throughout: one gauge, a speed test that still describes its pump, no
work in the maintenance log over the period of its log, and no load on any pumpdown. It is there to show the format
of the records and that they can be sound. **No audited result is given for it**: MS-BP clauses 2 to 7 fix every
convention the audit needs, so a worked answer would add nothing but an end-to-end check of a whole audit against a
known figure.

The ten chambers carry the faults that shop records carry. Each looks like ordinary data, and the documents say only
what was done, never its effect. Fourteen of the layers are settled by the data alone:
- **A reference condition no entry reaches.** Every chamber carries at least two mechanisms of comparable size, and
  its entries are spread in pumping time, vent gas and wall temperature, so that reading the latest entry across to
  the reference condition by any one mechanism's law misses. The budget has to be identified.
- **A fouling cold cathode.** On two chambers a cold cathode reads progressively low. The drift is a ramp and never
  a step, so it shows only as a slow trend in the ratio to the chamber's reference instrument, and on both the
  reference instrument fails part way through, leaving the later pumpdowns to be corrected by the fitted trend
  (VC02, VC09).
- **Crossed gauge serials.** Two chambers have each other's gauge serial in the log for their last three pumpdowns.
  The certificates are right, the two factors differ by 42 per cent, and the only sign is a step in each chamber's
  own series where its serial changes (VC03, VC07).
- **A seal the register gets wrong.** On one chamber the register names a perfluoroelastomer seal, while a nitrile
  one has been in place throughout, and nothing in any document says so. Taken from the register, the permeation is
  small and the rest of the constant gas load reads as a leak. Across the season that constant part follows the wall
  temperature as permeation through nitrile does, which a leak cannot (VC05).
- **A leak against permeation.** Both are constant in pumping time and both admit air, so only the gas load's
  temperature dependence across the log, or the oxygen and argon of a residual gas analysis, separates them (VC04
  against VC06).
- **A shop instrument that is wrong for every chamber at once.** Every shop speed test admits the same calibrated
  leak, and since the spring it has admitted more than it states, so every shop test since reports a speed low by
  one factor, on every chamber, while each chamber's own record looks like a pump that has lost a little speed and
  every controller shows its pump in order. Only the fleet shows it: a pump in order delivers its rated speed, and
  every chamber whose rated speed is on record tested at it before the change and below it by the same factor after.
  It matters most where nothing else gives the speed: on two chambers a baffle or trap was fitted without its
  conductance being recorded, so their speed is their speed test's, put right by the fleet's factor (VC03, VC05). It
  also moves every gas load read through a test's speed, VC08's 42 h reading among them, and the factor a test puts
  on a gauge certificate (VC01, VC04).
- **A speed test that is also a reading.** A shop speed test records the chamber's own base pressure before the flow
  is admitted, at the pumping time and wall temperature of that pumpdown. On one chamber it is the only reading at a
  long pumping time: VC08's load went up ninefold when its cryopanel brackets were replaced, every log entry since
  is at 16 h, and the log alone says nothing about how fast the new source falls. Its October speed test, taken
  after a 42 h weekend pumpdown, does, so VC08 is the chamber that looks as if it needs the test and does not.
- **A trapped volume that reads as a leak.** On VC07 a trapped volume behind a fixture plate refitted in July
  empties with a time constant of a day. Every pumpdown since is at 16 h, so it is a constant there; with the real
  leak small, the chamber fits an air leak to the noise, the wall gas following the wall temperature and the
  nitrogen vents and the rest doing neither. Only the July speed test, taken on the eve of the refit, shows that the
  constant part was not there before it, and nothing at all in the records says how fast it falls, which is what its
  gas load at the reference condition turns on. This is the chamber the test is needed on, and nothing points to it.
- **A pump with an ordinary gas load.** Two chambers are limited by speed while their gas loads are unremarkable, so
  an audit that puts every shortfall down to gas names the wrong cause and reaches the wrong figure for both
  quantities (VC09, VC10).
- **A gauge correction that depends on the answer.** The correction of MS-BP clause 5 follows from the composition,
  the composition follows from the split of the gas load, and the split follows from the corrected pressures, so the
  cause and the quantities have to be settled together.
- **A wall gas load that is not the table's.** Every chamber's coefficient differs from the outgassing table's
  nominal figure, from 0.45 to 2.6 times it, so the table sizes a pump but does not audit a chamber.
- **A gauge certificate that is wrong, and that no residual can show.** On one chamber the calibration laboratory
  issued the factor 14 per cent out. The error cancels in the gas load - every pressure the certificate yields is
  low by the same factor and every speed it yields is high by it, so Q = p S_eff comes out right and the gas budget
  fits to the reading noise - and it shows only in the speed, which comes out above what the chamber's pump in
  series with its port can deliver. MS-BP clause 4 says a pump delivers at most its curve, so the chamber's own
  throughput tests contradict its certificate, and its hot-filament gauge, the reference instrument of clause 5,
  disagrees with it by exactly that factor (VC01).
- **A replacement gauge whose certificate is out, which every simple reading fits.** On one chamber the cold cathode
  was swapped part way through the log for a spare head from stores, and the spare's certificate, issued the year
  before, is out: it reads every pressure high, so the speed test run on it reports the pump, which its controller
  shows in order, well below rated, where the old gauge's tests put it at rated. Take that test at its word and the
  gas budget fits to the noise, with the gas load right and the speed wrong. Take the pump at its rated speed and
  the certificate as issued, and the readings step up at the replacement, which a trapped volume dated to that
  maintenance entry absorbs just as cleanly, with the gas load and the cause wrong. Only the gauge explains both the
  step and the low test: a trapped volume cannot change a throughput test, and the vacuum data say a pump in order
  delivers its rated speed (VC04).
- **A register that names the wrong pump, which no fit can see.** On one chamber the register names a larger pump
  than the one that is fitted. Nothing in the gas budget depends on it; what depends on it is the rated speed, and
  with the register's pump the chamber's sound speed falls below clause 6's gate. The controller reports the rotor
  frequency, drive power and bearing temperature of the pump that is actually turning, and the vacuum data give
  those three figures for each model (VC07).

Nine more are recorded somewhere in the documents and have to be found and applied:
- **Internal surfaces replaced**, so the register's surface no longer applies and the entries before the work cannot
  be pooled with those after it (VC01, VC02, VC06).
- **A seal changed**, so one permeation constant does not serve the whole log (VC04, VC06).
- **A baffle or trap fitted** in the high-vacuum port, so the chamber's rated speed is not the register's and a
  sound pump is not judged against a conductance it no longer has (VC03, VC04, VC05).
- **A turbo that has lost speed**, dated by the controller's weekly rows, which voids every speed test taken before
  it (VC09, VC10).
- **A dated recalibration** of a gauge, which the certificate carries and the log does not (VC10).
- **Dry nitrogen vents** on some pumpdowns, after which the wall gas load is a quarter of what an air vent leaves
  (eight of the ten chambers).
- **Fixtures left in the chamber** on some pumpdowns, adding their own area to the outgassing (VC01, VC02, VC04,
  VC10).
- **Pumpdowns of different lengths and wall temperatures**, which have to be referred to one condition before any of
  them can be compared.
- **A test taken when the plan says.** The contractor tests at 16 h unless the plan names another pumping time, from
  4 to 48 h (`vacwork.md`). At 16 h the one chamber the test is needed on only repeats its log.

Each check left out or done the obvious way gets chambers wrong, and every chamber of the fleet must be right
(`authoring/evidence/route_study.txt`). Twenty-five routes, each leaving out one check or doing it the obvious way,
are each rejected; each chamber is missed by at least three routes; and each chamber is missed by at least one route
on its cause alone, so no chamber's grading turns on where the tolerance is drawn. Taking the records at face value
- the register's surfaces, seal and port, the latest speed test, the logged serials, every entry pooled, the table's
gas load and no gauge correction - gets ten of the ten wrong.

The audit test is load-bearing and measured to be so (`authoring/evidence/plan_sweep.txt`), over the whole space of
orders the budget allows: each gas-load test (rga, rate-of-rise, speed-test) on each chamber at each of the pumping
times 16, 20, 24, 30, 36, 42, 48 h, a helium test on each chamber, and placing no order at all, 221 orders in all.
Eighteen of them carry the reference to a pass, and the independent audit is carried by exactly the same ones: a
gas-load test on VC07 (rate-of-rise, rga, speed-test) at a pumping time from 20 to 48 h. A test on VC08, the chamber
whose log points at itself, is spent where its own speed test already answers; at the contractor's default 16 h a
test on VC07 only repeats what its log already says; and a helium test measures a leak, not how fast a trapped
volume empties."""
solution_explanation = """`solution/diagnose.py` is the reference audit and `solution/solve.sh` places the order and runs it. For each chamber
it does the following.

- **The chamber as it stands.** The register entry, changed by every maintenance row on or before the audit date:
  internal surfaces replaced, a seal changed in material or length, a trap or baffle fitted in the high-vacuum port.
  The pump is the one the controller's own figures identify. The seal is kept as a dated history, because a seal
  changed part way through the log means one permeation constant will not serve every entry.
- **The instruments.** Where a gauge serial in one chamber's log belongs to another chamber's certificate and that
  chamber's log carries this one's serial, the two are read back the right way round. A cold cathode is checked
  against the hot-filament gauge wherever both were read, and a drift in their ratio is carried as a straight line
  to the pumpdowns the reference instrument did not see. A certificate is out where the throughput tests read on
  that gauge report a speed the pump and port cannot have: above rated, or below it while the controller shows the
  pump in order. That gauge's readings and those tests' speeds are put right by the same factor.
- **The shop's calibrated leak.** Every shop speed test on a chamber whose rated speed is on record and whose pump
  was in order that day measures the leak's real flow against its stated one. Split in date order where the two
  sides' medians are best separated, they show the leak changed in the spring, and every test since is put right by
  that factor before anything else reads it.
- **The speed.** The pump curves are flat at base pressure, so the speed is one constant between the dates on which
  it can change: a trap fitted in the port, or a step in the controller's drive power and bearing temperature. The
  speed now is the ordered test's, read on the contractor's own gauge, or the latest shop test since the last such
  date; where neither exists it is found with the gas budget.
- **The observations.** Every kept base-pressure entry is an observation of the gas load at the speed in force on
  its date, whichever pump or port it was taken with: the gas load does not depend on the pump. Entries are kept
  from the last change of internals on. Each shop speed test is one more: its no-flow pressure is the empty
  chamber's base pressure at the test's own pumping time and wall temperature, taken with the speed that test
  measured. An ordered analysis or rate-of-rise is one more observation at its own pumping time and wall
  temperature, and a helium test is an observation of the leak.
- **The gas budget.** Fitted as MS-BP clause 3 gives it, Q_i = C_w W_i + Q_L + Q_v0 exp(-t_i / tau) + Q_perm,i, the
  trapped term only on and after the date it appeared, with W_i the table's nominal wall load for the entry's
  surfaces, fixtures, vent gas and wall temperature and Q_perm,i the seal's permeation at its temperature. Every
  coefficient is non-negative, each observation is weighted by its own repeatability, and the gauge correction of
  clause 5, which depends on the split, is iterated to a fixed point.
- **Which budget.** Every structure the records leave open is fitted: no trapped volume, one present from the start,
  or one that appeared on a date of logged work; the register's seal material, or another of the table's in its
  place. The fit with the least AIC is kept, with the small-sample correction wherever the sample allows it, so that
  a chamber with few entries since its last change does not take on a trapped volume on one degree of freedom.
  Setting the register's seal aside costs a fixed penalty, so it happens only where the records plainly contradict
  it. A structure is admissible only if it leaves more observations than parameters, and where the misfit is flat in
  the time constant - nothing measures how fast the trapped volume empties - the bound of clause 3.3 is taken, as a
  statement of what is not known.
- **The reference condition and the cause.** The fitted budget is evaluated at 36 h, 20 C, an air vent and no load,
  with the surfaces and seal the chamber has on the audit date. The cause is the pump where the actual speed is
  below 0.75 of the rated speed of the chamber as it is now, and otherwise the mechanism with the largest load.

The order it places is the whole budget of one test: VC07 rga at 36 h. Of the 221 orders the budget allows, eighteen
carry the reference to a pass, all a gas-load test on VC07 at a pumping time from 20 to 48 h
(`authoring/evidence/plan_sweep.txt`).

Run through `tests/grade_audit.py` as the verifier reads a submission, the reference gets every chamber right, with
its gas loads within 1.39 per cent of the truth and its speeds within 1.70 per cent
(`authoring/evidence/reference_run.txt`)."""
verification_explanation = """`tests/grade_audit.py` reads the submitted `/app/output/diagnosis.csv` and compares it with the sealed fleet. The
truth is computed from `tests/sealed/fleet.py` and `tests/sealed/bpphys.py` at grading time, from the chamber's true
volume, pumps, port, surfaces, seal, wall gas load coefficient, leak and trapped volume as they are on the audit
date, by MS-BP's model at the reference condition. It is never taken from running the reference solution, and
`authoring/evidence/preflight.py` checks that the sealed files under `tests/` and `environment/rig/` are the
provenance files byte for byte.

The sheet must be a regular file, not a symlink, of at most 100000 bytes of ASCII text: the header line exactly
`chamber,cause,q_total_mbarl_s,s_eff_l_s`, then one row for each of the ten chambers with none repeated, missing or
unknown; the cause one of MS-BP's five names, spelled as the standard spells it; the gas load and the speed finite
numbers inside generous ranges. Blank lines and surrounding spaces are ignored and the rows may be in any order.
Anything else is rejected, with a reason, and no submission crashes the grader. The instruction states every one of
these rules.

A chamber is right when all three of its fields are right: the cause matches exactly, the gas load is within 4.0 per
cent of the truth and the speed within 3.5 per cent. The sheet is accepted when every one of the ten chambers is
right. The instruction states the two tolerances; it does not say how many chambers must be right.

Why these tolerances, and why every chamber:
- **Correct methods.** Each tolerance is twice the widest deviation any sound method reaches on any chamber, rounded
  up to the half per cent, and preflight recomputes that rule from the record. Eighteen sound methods are accepted,
  each a complete sheet scored through this grader (`authoring/evidence/method_spread.txt`): the reference on the
  order it places and on five other sound orders, gas-load tests on VC07 at other pumping times;
  `authoring/evidence/independent.py`, a second audit written from the documents alone that shares no code with the
  reference, on each of the same orders - it solves the whole budget jointly by nonlinear least squares in the
  logarithm of the gas load, selects structures by BIC rather than AIC, with any added mechanism required to leave
  two degrees of freedom and to improve the fit significantly at one per cent, finds a seal the register gets wrong
  as a free permeation scale that is adopted only where it is well determined and lands on a material of the table,
  dates a turbo's change by a changepoint test, and finds the calibrated leak's change by the largest separation of
  trimmed means rather than of medians; and six variations of the reference - dropping the oldest entry, averaging
  the period's speed tests, asking twice or half the evidence before setting the register's seal aside, weighting
  the ordered test as a gauge reading, and a finer grid of time constants. Both audits are also right on VC07 on
  each of the twenty laboratory seeds of the ordered test's scatter, and on records rebuilt from each of twenty
  other draws of the shop's instrument noise (`authoring/evidence/seed_screen.txt`). Over every sound method and
  chamber the widest deviation is 2.00 per cent on the gas load and 1.79 per cent on the speed, so the tolerances
  stand at 2.00 and 1.96 times the spread of sound work.
- **Defective routes.** Twenty-five routes, each the reference with one check left out or done the obvious way, are
  all rejected (`authoring/evidence/route_study.txt`). Three of them are rejected by a single chamber -
  register_seal, trust_register_seal, undated_certificates - and the study fails unless each of those misses its
  chamber by at least 2.00 times the tolerance or on the cause outright, so no route is rejected on a knife edge.
  Routes that miss several chambers may graze a band on one of them: the nearest miss on a quantity anywhere in the
  study is 4.04 per cent, 1.01 times the gas-load tolerance. That costs nothing, because every chamber is missed by
  at least three routes, and by at least one on its cause alone. On every laboratory seed of the ordered test VC07
  is still missed by at least 8 routes.
- **Every chamber.** The allowance of one wrong chamber that earlier tasks carried is not used here, and the reason
  is measured (`authoring/evidence/plan_sweep.txt`): with an allowance of one, the audit test is not load-bearing at
  all, because the reference passes with no test ordered. Requiring every chamber makes the one chamber whose own
  records cannot settle its gas load decide the sheet, which is what the test is for.

Method-free answers are all rejected and none of them gets a single chamber right
(`authoring/evidence/null_baselines.txt`): the true result of one real chamber of the same shop copied onto all ten;
each of the five causes given to all ten; the latest reading times the latest speed test; the specified base
pressure times the latest speed test; the register's rated speed with the gas load it and the specification imply;
and three single-entry shortcuts that use the reference's own corrected readings and speed but read the gas load off
the latest entry - as it stands, with the table's wall and the rest a leak, or with the rest put down to the wall.
No chamber has a free pass.

`authoring/evidence/hedge_study.txt` records what a wrong attribution does to the quantities. It runs the reference
with its reading forced to each cause but the chamber's own - 10 chambers times 4 alternatives, forty cases - and
scores each sheet, naming that cause, through this grader. A wrong cause fails the chamber by definition; what the
study measures is whether the gas load survives the wrong reading. In 20 of the 40 cases it does and in 18 it does
not; in the other two the records leave too few observations to fit the forced reading at all. Not one sheet is
accepted. Where the total survives a wrong attribution the chamber is decided by the cause, which is graded on its
own.

Malformed sheets and edge cases are all built from the current reference at run time, never hard-coded, and scored
by the same grader the verifier calls (`authoring/evidence/verifier_checks.txt`). Thirty-eight cases all behave as
the rules say: a sheet that is a symlink, a directory or absent; no header, a renamed column, the columns reordered,
an extra column; a row missing or repeated; an unknown chamber; a cause outside the list or in the wrong case; a gas
load that is not a number, NaN, infinite, negative, zero or far out of range; a speed of zero, far out of range, or
a boolean; an empty file; bytes that are not ASCII; and a sheet padded past the size limit. 8 of those cases are the
bands themselves: each band is tried just inside and just outside, above and below the truth, so both edges of both
bands are measured rather than assumed.

Every evidence record carries on its first line a fingerprint of the files its result depends on, and preflight
fails if any record was written from inputs that have since changed.

The single pytest test decides the reward. `tests/test.sh` writes 0 to the reward file before grading starts, locks
`/logs/verifier` to root before grading and again before the reward, and writes 1 only when pytest exits 0 and the
ctrf report holds exactly one test, passed, with none failed, skipped, pending or other. A crash, a timeout or a
missing sheet all leave 0. Per-chamber results go to `/logs/verifier/metrics.json`, where they do not affect the
reward. The verifier pins numpy 2.1.3, scipy 1.14.1, pandas 2.2.3, pytest 8.4.1 and pytest-json-ctrf 0.3.5, runs in
its own environment without network, and keeps `/tests` at 700 so the sealed fleet is not readable.

In the agent's image the agent works as its own user and can write only to `/app/output`; `/app/data` is read-only.
The audit test order and the sealed definition belong to a separate contractor user, and the agent reaches the order
through one sudo rule that allows nothing but its status and submit commands. The order is charged to the
contractor's state file before any report is written, and a state that cannot be read counts as already placed, so
no test can be had twice."""

