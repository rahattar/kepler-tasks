expert_time_estimate_hours = 8
relevant_experience = """I am a control scientist and thermal engineer with a PhD in mechanical engineering and an undergraduate background in HVAC. Rating heat exchangers from plant data, separating fouling from flow effects and instrument errors, and planning which units to open and test with a limited outage budget are part of my work on industrial thermal systems and of my teaching. The cooler bank, its records and trends are synthetic."""
difficulty_explanation = """In practice this is the work of a plant thermal or reliability engineer who has to put a fouling figure on every cooler of a bank before an outage, with only a few units that can be opened and tested. The bank, its records, trends and test readings are synthetic, written by the disclosed generator in authoring/provenance from the sealed definition.

Each C-200's own March 2025 acceptance test, made just after hydroblasting, is its clean performance, and the design sheet's film-coefficient exponents carry it to the flows of every hour in the trend; the fouling resistance is 1/U from the trend minus that clean 1/U. The units wander up to a fifth from the design split (bundles rebuilt and repaired over the years), so the design sheet taken as it stands for every unit misses two by up to 0.12 m2K/kW. Several things in the records must be read correctly. The glycol-outlet RTDs are off by up to 2 K, differently on each unit; standby hours (water shut, glycol circulating) show each unit's own offset, and the bank's median offset used for all of them misses six units by up to 0.13. The cooling water of all units returns to one common header with no per-unit outlet temperature, so the duty has to come from the glycol side. One unit had tubes plugged with the count unrecorded; its tube-side pressure drop, up about 26 percent at a given flow, gives the open fraction, the actual area and the tube velocity (ignoring it misses by 0.15). One unit got a replacement bundle with the baffle spacing widened from 300 to 400 mm and no thermal test; the design sheet ties the shell-side crossflow velocity to the baffle spacing and the shell film to that velocity to the power 0.6, so its 2025 shell film scaled by 0.75^0.6 settles it (its 2025 test as it stands misses by 0.08).

The seven weeks of trend end fifteen days before the assessment, and they contain the two cooling-water events the maintenance log dates: ten days with the chlorine dosing pump down, over which every unit fouled about eight times faster, and the shock chlorination a fortnight later, which stripped part of what had grown. Carrying each unit forward means one rate with a level shift across the chlorine-free days and a step at the shock dose, the days of both events left out of the fit. One straight line through the record misses three units by up to 0.33 and through the last two weeks one by 0.10; fitting the shock step but not allowing for the chlorine-free days misses five by up to 0.50, the reverse three by up to 0.34, the seven-week median one by 0.17 and the last two days one by 0.14.

Four units cannot be settled from the records at all, and there are three slots, so one slot has to serve two units. Two of the ten are new coolers commissioned together in 2026 with no site test: they were built to one drawing in one batch and the vendor ran its thermal program once for the pair, so a clean test on either gives the factor that single rating is out by and it carries to the other (left on the datasheet, the untested one misses by 0.07). One unit's 2025 sheet does not close its heat balance: the water-side duty is 6 percent below the glycol side, where every other sheet closes within about 1 percent. No single reading repaired from the other side's duty, nor the mean of the two duties, recovers it (0.13 to 0.27 off), and its clean performance is far from its sisters' (the design split or the sisters' median factor miss by 0.09), so only a test settles it. The three units retubed with ribbed tubes have no clean test since. The rib height differs by tube lot, so one unit's measured gain carried to the others misses by 0.06; but the retube note ties the two gains of a rib form through one coefficient that holds for all three lots whatever their rib height, every unit's pressure drop shows its own friction gain against its 2025 test, and one tested ribbed unit fixes that coefficient. The reactor-jacket unit is ribbed and never stands by, so its RTD offset is unknown too (left untested it misses by 0.26); testing it settles both, and the DCS readings logged with the test show its offset. The bank runs at nearly fixed flows, so an unknown film cannot be fitted from the trend's own flow variation instead (a Wilson plot's own standard error on the test-day value is 0.06 to 0.13, so any agreement is chance). Of the 120 ways to spend the three slots, two pass, both of them the reactor-jacket unit, the open-sheet unit and one of the new pair; every other allocation misses by at least 0.073. The plan the symptoms seem to call for, one slot for each unit the records cannot settle, needs four."""
solution_explanation = """solution/solve.py reads the register, the maintenance log, the 2025 acceptance tests, the documents and every trend. Each unit's glycol-outlet offset is the median of outlet minus inlet over its standby hours. Each C-200's 2025 clean U (glycol-side duty over the counterflow LMTD, at the design area) fixes one common factor on the design sheet's film split, and the exponents 0.8 on tube velocity and 0.6 on glycol crossflow velocity carry it to any flows; for E5 the shell film is further scaled by (300/400)^0.6 for the replacement bundle's wider baffle spacing, read from the bundle shop note. From the records it lists what they cannot settle: no site clean test (E1 and E10), a 2025 sheet whose water-side and glycol-side duties differ by more than 2 percent (E9, 6 percent), and a ribbed unit that never stands by (E8). That is four units for three slots, so it tests one of the new pair and not both: the C-310 datasheet is one rating from one program for two coolers built to one drawing in one batch, so the factor that rating is out by, measured on the tested twin's clean test, is the untested twin's clean performance too. A tested unit's as-found fouling resistance is 1/U as found minus 1/U clean from the reference instruments. For E8 the clean test also gives its tube film (clean 1/U minus the shell film and wall), its film gain over its 2025 tube film, and with its friction gain (tube-side dp at a given flow over its 2025 test) the coefficient of the retube note's relation, which carries to E3 and E7 through their own friction gains. For E2 the dp ratio to its 2025 test, to the power -1/1.8, is the open fraction of tubes. For every untested unit, every running hour gives U from the offset-corrected glycol-side duty over the LMTD at its actual area, the clean U at that hour's flows, and their difference in 1/U; a least-squares fit of one rate in time with a level shift across the chlorine-free days and a step at the shock chlorination, both dated from the maintenance log and both events' days left out, carries it to 2026-10-26. On the shipped bank every unit is within 0.011 m2K/kW. It never reads the sealed definition or the verifier."""
verification_explanation = """The verifier holds the bank's sealed definition (tests/hx.py, seed 11), the same module that drives the clean-and-test service. One test gates the reward: /app/output/fouling.csv must have the columns unit and fouling_m2k_per_kw, one row for each of E1-E10 and no others, finite numbers, and every unit's value must be within 0.04 m2K/kW of its true as-found fouling resistance on 2026-10-26. The per-unit record goes to /logs/verifier/metrics.json and never gates. The verifier never runs the reference solution and never reads the shipped files.

The 0.04 m2K/kW is the band the verifier applies. It is stated in no file the agent can read, neither the instruction nor the documents, so an answer cannot be split between two readings of a choice and aimed at the band; preflight fails if the number appears in the instruction or anywhere under environment/data, and the documents settle those readings themselves (the retube note ties a rib form's film gain to its friction gain through one coefficient; the design sheet ties the shell-side crossflow velocity to the baffle spacing; the C-310 datasheet is one rating for both new coolers). The evidence in authoring/evidence shows the band is wide against the spread of sound methods and narrow against wrong ones (worst unit's error, m2K/kW). method_spread.txt: 216 sound estimates (each passing allocation in every run order; the 2025 clean test split by a common factor or wholly onto either film; median or mean standby offset; one rate with the outage shift and the shock step over seven weeks or the last three, or a line through the hours after the shock dose) all pass, the worst at 0.026. route_study.txt: offset not removed 0.14, one offset for the whole bank 0.13, the design split used for every unit 0.12, fouling not carried to the test day 0.14 to 0.17, one line through the record 0.33, the chlorine-free days not allowed for 0.50, the shock step not fitted 0.34, plugging ignored 0.15, ribbed gain not applied 0.16, one ribbed unit's gain carried to the others 0.06, the rebuilt bundle's 2025 test used as it stands 0.08, the untested C-310 twin left on the shared datasheet 0.07, the open 2025 sheet used or repaired in any of seven ways 0.13 to 0.27 or set aside for the design split or the sisters' median 0.09, a ribbed unit other than the reactor-jacket unit tested 0.25, an unknown film fitted from the trend (Wilson plot) 0.05 to 0.53 with the fit's own standard error 0.06 to 0.13 (an error near zero, as on one of the C-310s, is chance inside that band: wilson_noise.txt re-draws only the measurement noise and moves those errors between -0.42 and +0.60). campaign_study.txt: of the 120 ways to spend the three slots, with every fallback above for what each leaves untested, two pass, both of them the reactor-jacket unit, the open-sheet unit and one of the new pair; every other allocation misses by at least 0.073. hedge_study.txt: the readings the documents settle, against the laws a solver could invent through the one tested ribbed unit's measured point instead (a power, square-root or saturating law): they span 0.030 to 0.034 m2K/kW at the two untested ribbed units, where the note's relation lands at 0.008 and 0.007, and the rebuilt bundle's and the untested twin's two readings are 0.08 and 0.07 apart. constant_null.txt: the ten true values are irregular and at least 0.091 apart (0.104 to 1.283 m2K/kW), wider than the 0.08 window, so no single constant satisfies more than one unit; zero, 0.35 and the bank's median (0.644) satisfy none. Nor can a unit be filled in from the spacing of the others: with the other nine known exactly, the midpoint of its neighbours (or one median gap beyond the end) misses six units, all three that need a test among them, by 0.05 to 0.10. Every unit therefore has to be assessed on its own, and a submission passes only if all ten are.

The clean-and-test service runs in the agent's container as a separate user, contractor. The agent runs as the user agent ([agent] user); the service's code, the sealed definition and the slot count are owned by contractor with mode 700, so the agent cannot read them, signal the service or edit its state. The agent starts the service with start-hxtest, which runs one fixed script as contractor through a single sudo rule that admits no arguments and passes no environment. Slots are charged before the test is made, so restarting the service does not reset the count; reports are written to /app/test_reports. /app is owned by root with the sticky bit (group-writable for agent), so the agent can create its own files there but cannot rename or replace /app/test_reports or /app/data. The service opens /app/test_reports once at start and refuses it unless it owns it and no one else can write to it; each report is created there as a new file, never through a link and never over an existing file. The slot record is read without following links, the slots left are recomputed from the list of tests, and a record that cannot be read or does not add up counts as no slots left; changes to it are locked across threads and processes. The verifier runs separately with no network, and /logs/verifier is root-only."""

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[agent]
timeout_sec = 28800.0
user = "agent"

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 4096
gpus = 0
network_mode = "public"
