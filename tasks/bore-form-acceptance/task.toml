artifacts = ["/app/output/form.csv"]

[task]
name = "afterquery/bore-form-acceptance"
description = "Sentence the fourteen finish-machined cylinder bores, gland bores and ram journals of a hydraulic press overhaul on form and size: a minimum-zone form error and an accept or reject against each drawing, from raw measured profiles, the shop's records and a metrology room booking of four dense scans."
authors = [{ name = "Alireza Bafandeh", email = "rahattar@gmail.com" }]
keywords = [
    "dimensional-metrology",
    "form-tolerance",
    "minimum-zone",
    "gdt",
    "measurement-planning",
    "instrument-error",
]

[metadata]
author_name = "Alireza Bafandeh"
author_email = "rahattar@gmail.com"
author_organization = "MEMC"
author_profile = "https://www.linkedin.com/in/alireza-bafandeh"
research_advisor = ""
referred_by = ""
conflicts_of_interest = "I am employed by MEMC (GlobalWafers), a silicon wafer manufacturer; this task has no connection to my employer's products, processes or data. It uses only textbook dimensional metrology (reference figures for form, minimum-zone fitting, the envelope requirement and Taylor's principle, harmonic analysis of roundness profiles, filter bands and sampling, instrument error motion and thermal reference) on synthetic parts and records. I also author evaluation tasks for other AI benchmark programs; this task shares no data, code or scenario with them."
domain = "engineering-sciences"
field = "mechanical-engineering"
subfield = "dimensional metrology: form and size"
category = "Science"
subcategory = "Mechanical & Aerospace Engineering"
tags = [
    "dimensional-metrology",
    "form-tolerance",
    "minimum-zone",
    "gdt",
    "measurement-planning",
    "instrument-error",
]
expert_time_estimate_hours = 5
relevant_experience = """I am a control scientist and mechanical engineer with a PhD in mechanical engineering. Dimensional metrology of machined features, the reference figures that form tolerances are defined against, harmonic analysis of roundness profiles, what a set of measured points can and cannot settle, separating instrument error from part error, and planning the few measurements a job allows are part of my work on industrial equipment and of my teaching. The press, its features and its records are synthetic."""
difficulty_explanation = """In practice this is a works metrology and overhaul job: a press is stripped, its bores and journals are finish-machined and measured, and someone has to put a form error and an accept or reject against each one before it is rebuilt. Its research analogue is the identification of a measured surface from raw profile data, which is where dimensional metrology is genuinely hard: the reference figure a tolerance is defined against, the band of undulation the tolerance covers, the separation of what belongs to the part from what belongs to the instrument, and what a set of points can and cannot settle. The press, its records and its metrology room are synthetic, written by authoring/provenance from a sealed definition. The deliverable is a form error in micrometres and one of four sentences for each of 14 features, and the gate is all 14.

Standard FM-7 defines the assessment: the profile of a section is its radii less the mean, orders 0 and 1 dropped and order n weighted by exp(-pi (0.4697 n / 50)^2); form is a minimum-zone value, concentric circles per section for a roundness callout and coaxial cylinders over all three sections for a cylindricity one; size is sentenced by Taylor's principle, the mating size being the largest inscribed or smallest circumscribed cylinder and a local size a diametrically opposite pair; every size is referred to 20 C. Each of those is a thing the instrument software does not do, and the inspection report shows what it does instead: a least-squares zone and a mean diameter. Taking the least-squares zone misses every feature's form error, by up to 5.0 um. Taking the mean diameter for the mating size sentences 7 features wrong. Leaving the Gaussian band off, so that the finishing pass's feed waviness counts as form, misses all 14. Computing roundness where the drawing calls cylindricity misses the four cylindricity features by up to 9.4 um, because taper counts against a cylindricity zone and not against a roundness one. Not referring sizes to 20 C sentences 4 wrong.

Three things the records cannot settle on their own. Five features were measured only on the coordinate machine's bore program, at 12 touch points a revolution, which cannot resolve a band that runs to 50 undulations: what those points give is not a small form error but an aliased fraction of a large one, and no care taken afterwards recovers it. One bore was re-honed after it was measured, so its record describes a surface that no longer exists. That is six features for a booking of four scans. The machining log records which features were finished in one setup without unclamping, and the lobing a setup leaves is the setup's, so a scan of one feature carries the form error and the mating deviation of the other feature of its setup, while each keeps its own size from its own record: six needs fall into four setups, and the booking covers them. Of the 1001 ways to spend the booking, 8 get all 14 features right, and the best any other does is 13. Spending one scan per sparse feature, which is what the symptoms seem to call for, needs five.

What no document gives is the instrument. A record's angle is the form tester's spindle angle and a part is clamped wherever it comes to rest, so a component that repeats in amplitude and in phase across parts bored in different setups on different machines cannot belong to the parts. The shop's tester carries 4.6 um at 23 undulations and 3.9 um at 29, and its records are the only place that shows it: averaging them leaves the machine and averages the parts down, and the orders to keep are those whose mean stands clear of the scatter between parts. Charged to the parts instead, it adds up to 11.6 um to a form error and sentences 8 of the 14 wrong, and nothing in the records contradicts the result: the inspection report's own figures carry the same error, so a solver that checks its work against them finds agreement. Taking the whole average off each part, rather than the orders that belong to the machine, sentences 4 wrong."""
solution_explanation = """solution/solve.py is the reference; solution/solve.sh runs it in the agent's environment. It uses only /app/data and the scans it orders through `formscan`, and never reads the sealed definition.

1. **The instrument first.** It averages the assessment profiles of the nine records of the shop's form tester and keeps the orders whose mean stands three standard errors clear of the scatter between the parts: orders 23 and 29, 14.1 um peak to valley. That is the tester's error motion, and it is subtracted from every one of its records. The metrology room's tester is certified, so a scan carries none of it.
2. **What needs a scan.** A record cannot carry a feature's form when it has fewer than 101 points a revolution, which cannot resolve FM-7's band to 50 UPR, or when the machining log shows work on that feature after the day it was measured. That is five under-sampled features and one re-honed bore.
3. **The booking.** Those six are grouped by the setup the machining log puts them in, and one scan is ordered per group: four scans for four groups. For a feature left unscanned, the form error and the mating deviation come from the scanned feature of its setup, both being independent of where the angular origin sits, while its mean radius and its taper come from its own record, where twelve points average a radius well.
4. **The assessment.** Per section: the mean radius referred to 20 C, and the deviations filtered to FM-7's band. Then, by linear programming on the deviations, which are micrometres on a radius of hundreds of millimetres: the minimum zone, concentric circles per section or coaxial cylinders over the feature with the axis free in position and tilt; the mating cylinder, largest inscribed for a bore and smallest circumscribed for a journal; and the local sizes as diametrically opposite pairs.
5. **The sentence.** A bore accepts on size when its mating size is at or above the lower limit and its worst local size at or below the upper, a journal the other way about; form accepts within tolerance; the two give accept, reject_size, reject_form or reject_both.

On the shipped records every feature is right, the worst form error being 0.16 um against a band of 1.2.

**authoring/evidence/independent.py** is a second solution, written separately: pandas for the records, the machine's error motion found by a different test (an order belongs to the machine when its phase agrees across the records, the mean resultant length of the phases being 1.00 at orders 23 and 29 against 0.53 or less everywhere else) with its amplitude taken as the median, the minimum zone and the mating cylinder solved as constrained problems by SLSQP rather than as linear programs, the axis parameterised by its offset at the two ends, and the other feature of each pair scanned. It also gets all 14 right, its worst form error being 0.63 um."""
verification_explanation = """The deliverable is one CSV file, /app/output/form.csv, with a form error and a sentence for each of the 14 features. The verifier (tests/grade_form.py, run by tests/test_form.py under pytest) grades it against the sealed definition in tests/sealed: a feature is right when the reported form error is within 1.2 um of the minimum-zone form error of its true surface and the sentence matches exactly. The sheet is accepted only when all 14 are right. One pytest test carries the reward; test.sh writes 0 first and writes 1 only when pytest exits 0 and the ctrf report shows exactly 1 test, 1 passed. The per-feature record goes to /logs/verifier/metrics.json and never gates.

The truth comes from the sealed definition authoring/provenance/isim.py, never from running the reference, and the agent never sees it. The 1.2 um band is stated in no file the agent can read: preflight fails if it appears in the instruction or in any document under environment/data, so an answer cannot be split between two readings and aimed at it. The evidence in authoring/evidence shows the band is wide against the spread of sound methods and narrow against wrong ones; every figure below is the worst error on a reported form error, or the count of the 14 features sentenced wrong.

method_spread.txt: 192 sound runs, every booking that covers what the records cannot carry crossed with every order the four scans could be ordered in and with the mating gauge taken over the feature or section by section, all pass, the worst at 0.16 um. independent.txt: the second solution, 0.63 um. route_study.txt: 15 defective routes, and every one of the 14 features is sentenced wrong by at least 4 of them. The tester's error motion charged to the parts 11.6 um and 8 features; the whole average of its records taken off each part 5.3 um and 4 features; a least-squares zone 5.0 um and all 14; the Gaussian band left off 7.2 um and all 14; nothing removed at all 52.6 um; the mean diameter for the mating size 7 features; no temperature correction 4; roundness where cylindricity is called 9.4 um and 4; no scans at all 6 features; scans ordered but a setup not used to carry its twin 2; one scan per sparse feature, so the re-honed bore left out, 2. campaign_study.txt: of the 1001 ways to spend the booking, 8 pass and the best of the rest gets 13 of 14. null_baselines.txt: the sentence is one of four words and the true bank is 4 accept, 3 reject_size, 3 reject_form, 4 reject_both, so no constant sentence gets more than 4 of the 14 on the sentence alone and none gets a single feature right once the form error has to be right too; transcribing the inspection report's own roundness and mean diameter gets 1 of 14. hedge_study.txt: the sentence is categorical, so it admits no hedge at all, and on the choices that matter the two readings of the form error are further apart than twice the band on most features. verifier_checks.txt: 23 malformed sheets, every one rejected as a whole and none crashing the grader, and five correct sheets written untidily, all accepted.

In the agent's container the sealed definition and the metrology room's booking records live under /opt/room, owned by the user room with mode 700. The agent reaches the room only through `formscan`, a sudo wrapper for /opt/room/lab.py admitting one command and no environment. The program validates its argument, creates one exclusive record per scan, charges the scan before it is made, refuses a feature already scanned, refuses any scan beyond the booking of 4, and refuses to run if its directories are not as installed. The agent works as a separate user that can write only to /app/output; /app/data is read-only. The verifier runs in a separate container without network, and /logs/verifier is root-only."""

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[agent]
timeout_sec = 28800.0
user = "agent"

