[task]
name = "afterquery/fan-critical-speed"
description = "Write a program that finds the two lowest lateral critical speeds of an overhung fan after an impeller change, identifying its pedestal stiffnesses from standstill impact tests and the fan's own records and modeling the rotor to the plant's rotordynamic standard, and that stays right on fans it has never seen."
