conflicts_of_interest = "I am employed by MEMC (GlobalWafers), a silicon wafer manufacturer; this task has no connection to my employer's products, processes or data. It uses only published rotordynamic practice (Euler-Bernoulli rotor finite elements, gyroscopic coupling, synchronous critical speeds, support identification from impact tests) on synthetic fans and records. I also author evaluation tasks for other AI benchmark programs; this task shares no data, code or scenario with them."
