artifacts = ["/app/controller.py"]

[task]
name = "afterquery/wafer-chill-control"
description = "Write the real-time controller for a vacuum wafer chill station: cool every wafer as fast as an unmeasured zone-uniformity limit allows when each wafer's sag is unknown."
authors = [{ name = "Alireza Bafandeh", email = "rahattar@gmail.com" }]
keywords = [
    "closed-loop-control",
    "state-estimation",
    "system-identification",
    "rarefied-gas-conduction",
    "wafer-thermal-management",
    "semiconductor-equipment",
]

[metadata]
author_name = "Alireza Bafandeh"
author_email = "rahattar@gmail.com"
author_organization = "MEMC"
author_profile = "https://www.linkedin.com/in/alireza-bafandeh"
research_advisor = ""
referred_by = ""
conflicts_of_interest = "I am employed by MEMC, a silicon wafer manufacturer, and this task is adjacent to semiconductor equipment work. I also author evaluation tasks for other AI benchmark programs."
domain = "engineering-sciences"
field = "mechanical-engineering"
subfield = "rarefied gas heat transfer and constrained feedback control"
category = "Science"
subcategory = "Mechanical & Aerospace Engineering"
tags = [
