[task]
name = "afterquery/hydraulic-unit-audit"
description = "Write a program that reduces a press hydraulic power unit's logger record (system and pump pressures, motor power) to the oil delivered, the peak demand flow, the hydraulic and electrical energy per cycle and the unit's efficiency, and that stays right on units it has never seen."
