conflicts_of_interest = "I am employed by MEMC (GlobalWafers), a silicon wafer manufacturer; this task has no connection to my employer's products, processes or data. It uses only textbook fatigue and fracture engineering (linear-elastic fracture mechanics, BS 7910 flaw assessment, ASTM E647 crack growth testing, crack closure, weld residual stress) on synthetic cracks, steels, loading and records. I also author evaluation tasks for other AI benchmark programs; this task shares no data, code or scenario with them."
