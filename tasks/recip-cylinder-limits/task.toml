conflicts_of_interest = "I am employed by MEMC (GlobalWafers), a silicon wafer manufacturer; this task has no connection to my employer's products, processes or data. It uses only textbook reciprocating compressor engineering (the gas and inertia loads on a piston rod through a crank revolution, the rating of a cylinder body against gas load and of a frame against combined rod load, pin reversal, adiabatic discharge temperature, volumetric efficiency from clearance, indicated cylinder power, and the isentropic exponent of a gas mixture from its molar heat capacity) on a synthetic machine, synthetic records and a synthetic standard. I also author evaluation tasks for other AI benchmark programs; this task shares no data, code or scenario with them."
