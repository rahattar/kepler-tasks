artifacts = ["/app/review.json"]

[task]
name = "afterquery/hvac-submittal-review"
description = "Review a contractor's cooling load calculations and rooftop unit selections for a 2004 college building: ASHRAE 62.1 multiple-zone outdoor air, coil entering conditions, extended catalogue performance, and the building as it exists under a field-verification budget."
authors = [{ name = "Alireza Bafandeh", email = "rahattar@gmail.com" }]
