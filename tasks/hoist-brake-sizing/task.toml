schema_version = "1.4"

artifacts = ["/app/output/brakes.json"]

[task]
name = "afterquery/hoist-brake-sizing"
description = "Select a spring-applied motor brake size and torque setting for each of twelve foundry crane hoists so that every brake meets the five requirements of a plant standard (holding, emergency-stop travel and deceleration, lining temperature, gearbox torque) on the hoist as it is now and in its working duty, using eight friction and engagement tests in a brake laboratory and the plant's records."
authors = [{ name = "Alireza Bafandeh", email = "rahattar@gmail.com" }]
keywords = [
    "hoist-brakes",
    "brake-sizing",
    "friction-materials",
    "brake-thermal-model",
    "test-planning",
    "cranes",
]

[metadata]
author_name = "Alireza Bafandeh"
author_email = "rahattar@gmail.com"
author_organization = "MEMC"
author_profile = "https://www.linkedin.com/in/alireza-bafandeh"
research_advisor = ""
referred_by = ""
conflicts_of_interest = "I am employed by MEMC (GlobalWafers), a silicon wafer manufacturer; this task has no connection to my employer's products, processes or data. It uses only textbook machine design and tribology (spring-applied brakes, the friction of organic linings against temperature, lumped thermal models of braking duty, hoist drive mechanics and gear efficiency) on synthetic hoists, brakes, linings and records. I also author evaluation tasks for other AI benchmark programs; this task shares no data, code or scenario with them."
domain = "engineering-sciences"
field = "mechanical-engineering"
subfield = "machine design: brakes and lifting equipment"
category = "Science"
subcategory = "Mechanical & Aerospace Engineering"
tags = [
    "hoist-brakes",
    "brake-sizing",
