relevant_experience = """I am a control scientist and mechanical engineer with a PhD in mechanical engineering. Following a plant contingency through to the equipment it reaches, reading a plant's records for what has changed since its documents were issued, identifying equipment performance from operating data, and judging when a protective function may be credited against a contingency are part of my work on industrial equipment and of my teaching. The unit, its records and its documents are synthetic."""
difficulty_explanation = """
A flare load study is what a process safety or mechanical engineer does whenever a unit is modified, and it is a different exercise from sizing a relief device. A device is sized against the worst case it will ever see, one device at a time. A flare system is sized against what the plant does all at once: a single contingency reaches many items together, and the header and the stack tip have to pass the sum of what those items relieve. So the question is not how big each valve must be, but which valves a given contingency actually opens, how much they put into the header between them, and what pressure that raises at the far end of it. The answer is a table keyed on the contingency, not on the equipment.

The method is the one API 521 and the plant standards built on it set out, here RP-7. Its research analogue is the mechanics and thermodynamics of emergency relief in a collecting system: the heat a pool fire puts into a wetted vessel and the vapour that heat generates, the capacity of a control valve at full travel from its installed characteristic, the heat transfer of a reboiler at a duty other than its design duty, orifice metering when the density has moved away from the value the flow computer holds, a centrifugal pump's reach against a closed discharge, the mixing of streams of different molar mass and temperature into one header, and compressible pressure loss along a header whose flow accumulates towards the stack. The unit, its records and its documents are synthetic, written by authoring/provenance from a sealed definition. They are realistic, and so is the level of challenge they present:

- **The unit:** a natural gas liquids recovery train of nine relief devices, PSV-401 to PSV-409, on an inlet separator, a fuel gas knock-out drum, two reflux or receiver drums, a product drum, two fractionating columns, a feed/bottoms exchanger shell and a pump discharge, all nine discharging to one flare header with a 457 mm bore, 380 m of developed length and a 305 mm stack tip.
- **The contingencies:** loss of the normal electrical supply, loss of cooling water, loss of instrument air, and a pool fire in each of three fire zones. Six rows.
- **The deliverable:** for each contingency, the devices that discharge, the load in kg/h and the pressure at the header's inlet in barg; and the re-rating of the stack tip the standard calls for. Nothing in the records states any of them.
- **The booking:** the unit's test crew is on site for one shift and will run two of the six tests it offers. A test is charged when it is ordered, whatever it returns, and no test is run twice, so both orders have to be placed on what the records already say. Two of the six reach a graded value and four cannot.

**The core of it is that the study does not come out in sequence.** A conventional spring-loaded relief device is referenced to atmosphere, so it opens at its set pressure plus whatever pressure stands at its outlet; a device with a balanced bellows does not, and the register says which is which. What stands at a conventional device's outlet is the pressure in the header at its own tie-in, built up by the very flow every device is putting into the header. So the rates fix the header pressures, the header pressures fix the relieving pressures, and the relieving pressures fix the rates. There is no order in which these can be taken: the contingency has to be brought out as one system, swept from no built-up pressure until nothing moves, and which devices discharge at all is settled on the converged pressures. A study that works the rates first and the header afterwards - the obvious reading, and the one the 2019 study was made on - is wrong by 8 per cent on the governing load and 6 to 8 per cent on two of the pressures, and gets three of the six contingencies wrong. Taking every device as conventional, or every device as balanced, gets two wrong. The feedback is negative, so the sweeps close on one answer from below at about a tenth of the gap each pass; nothing has to be guessed, but nothing can be skipped either.

The rest of the difficulty is that the chain from a contingency to a relieving device runs through records that have moved on since the documents were written, and that the two numbers in each row depend on the device set being right first:

- **Loss of power now carries loss of air with it.** The 2019 study treated them as separate contingencies and said so in a note, because the instrument air compressor stood on the essential supply. A switchboard rebuild moved it to the normal supply; the drive schedule shows where it stands now, and the modification register says when it moved. So loss of power now opens the three control valves that fail open as well as taking the cooling away, and it becomes the governing case by a wide margin. The same modification left the safety instrumented system on the essential supply, which is what lets one instrumented credit survive the power failure.
- **Which control valves fail open is a record, not an assumption.** Three of six fail open and three fail closed. An assessment that takes them all one way either empties the air failure case or fills it with devices that cannot be reached.
- **One instrumented function of four may be credited.** Of the other three, one is below SIL 2, one is proof tested at 24 months against an 18 month limit, and one initiates on the very measurement the control whose failure causes the contingency uses, so it is not independent of it. The qualifying one removes a column's loss of cooling from two rows.
- **One device discharges under nothing at all.** A pump's blocked discharge is the only cause its register row admits besides fire, and its shutoff head has decayed to the point where it can no longer reach the relieving pressure. Only its latest performance test shows this; the data sheet curve would still reach.
- **The control valves do not have the coefficients on their data sheets, and their own trends do not describe them either.** Three of the five were re-trimmed in 2026 and each came back about 14 per cent below its sheet. Each of those three trends runs in two blocks, one before the work on that valve and one in the last days of the record, and the maintenance log is the only thing that says where the join is. A trend read whole fits something between the two, which is to say a valve that has never been in service: on the feed valve that is 8 per cent high, and because all three re-trimmed valves lost capacity the three errors add rather than cancelling. Nothing complains, and the figure that comes out sits between the data sheet and the truth, so there is nothing in it to check. The two valves that were never re-trimmed run in one block and their fits confirm their sheets to half a per cent, which is how the method itself can be checked.
- **One valve's flow column is read by the unit's feed meter**, an orifice meter whose flow computer still holds the relative density entered at commissioning; the feed has got richer since, as the dated analyses show, so that flow is low by about 4 per cent and has to be corrected before the coefficient can be fitted. The standard does not mention it. What gives it away is the instrument schedule recording the fixed density, the analyses recording the gas, and the fact that mass through an orifice goes as the square root of the density.
- **The reboiler's record is in two states as well.** E-403's steam trap was renewed part way through the 42 days, and before that it was flooding and making 85 per cent of its surface. The mean over the whole record is 3.9 per cent low; the mean over the days since the renewal is the exchanger that is there now. Again the log is the only thing that marks the join, and again the pooled figure looks perfectly ordinary.
- **The steam gives up more than its latent heat.** The duty each day of the record carries is not the steam flow times the latent heat: E-403's condensate leaves sub-cooled at 128 C, and the exchanger data publishes that temperature and the condensate's specific heat alongside the surface and the design duty. Taking the latent heat alone puts the coefficient-area 13.1 per cent low and the cooling-failure pressure 21.7 per cent out. The standard asks for the duty and says nothing about how the steam delivers it.
- **One vessel's level is not the level the data book gives.** The data book says its levels are what the level transmitters indicate, and the instrument schedule records that LT-4075 on the propane drum was ranged for a specific gravity of 0.500 at commissioning. The drum holds a 0.447 liquid, which the data book states in its own column, and a differential-pressure transmitter reports the head it sees divided by the density it was ranged for: the level is 1.622 m, not the 1.450 m indicated. That is 8.4 per cent on the drum's wetted area and 5.7 per cent on its fire zone's pressure. No rule points at it.
- **The reboilers are not at their design duty.** The data sheet duties are at the original feed rate and the unit now runs above it, so the coefficient-area has to come from the operating record. The vapour a column makes on total loss of cooling then follows from the steam supply temperature and the temperature of the liquid the column is boiling at the relieving pressure, which is its bottoms, not its overhead.
- **The fire cases turn on geometry and on insulation that changed after the data book.** A column was re-set 0.90 m higher on an extended skirt, which moves how much of it falls below the 7.6 m the fire case counts; the vessel data book is still the 2019 issue. Two items were re-insulated to a fire-resistant specification and now earn an environment factor, which collapses one zone's load by a factor of thirty; a third carries lagging with no certificate and earns nothing.
- **The header is not one pipe carrying one flow.** Devices tie into it at nine different distances from the stack base, so each length of header between two tie-ins carries only what ties in beyond it, and carries that mixture rather than the whole load. The pressure has to be worked out from the tip outwards, length by length, each with its own flow, its own mixture and its own density. One tie-in was moved 114 m out onto a new lateral after the isometrics were last issued, which changes which lengths carry its flow and moves the inlet pressure of three of the six rows.
- **The superseded study.** The 2019 flare load study on file is correct for the plant as built and states its basis. Taken as the answer now it gets none of the six rows right, and the note it ends on is the thread the whole study pulls.
- **Two quantities are in no record at all, and the booking is what gets them.** The stack tip was replaced in 2025 by another vendor who supplied no performance data, so the loss coefficient of the tip now installed is written down nowhere; the figure in the 2019 study belongs to the tip it replaced and is 16 per cent away from it, which is enough to fail five of the six rows. P-401's rotating element was renewed in 2026 with a trimmed impeller and not performance tested, so every curve on record describes a pump that could still reach PSV-405's relieving pressure, where the one now installed cannot: an assessment made on the record carries a device that does not discharge. Both have to be measured, and the booking is exactly two tests, so neither order may be spent on the four tests that cannot reach a row. Working out which those are is the study in miniature: E-406's coefficient-area is only ever used for a cause the credit for SIF-4061 sets aside, no device admits a cause PV-4031 could create, a loss of cooling is total however capable E-404 is, and PSV-404's set pressure is already in the shop record.

- **The re-rating.** The standard will not leave a conventional device standing against more than 5 per cent of its own set pressure, and the tip as installed leaves one at 9.1 per cent. The duty is the smallest bore the vendor supplies that brings every conventional device inside the limit under every contingency, which is an outer search with the whole coupled system inside it: each candidate bore changes the tip's loss, which changes every back pressure, which changes the relieving pressures and so the rates. Scaling the shares off the tip as installed instead of re-converging each candidate picks a bore one size too small. The binding device is the one with the lowest set pressure, not the one carrying the most flow, and it has to be named.

Each of these defeats an assumption the general approach makes on first reading:
- that contingencies named separately in a standard stay separate on a particular plant;
- that a data sheet describes the equipment installed;
- that a record of the plant running describes the plant as it now stands, rather than two machines either side of a day's work;
- that a meter's indication is the flow;
- that a design duty is the duty;
- that every cause a register admits is a cause that can happen, and that a protective function listed may be credited;
- that a data book or an isometric issued with the plant still describes it;
- that a header can be treated as one pipe passing the whole load;
- that a relieving rate can be worked out before the header it discharges into, and that a device opens at the pressure stamped on it;
- that every figure the files carry describes the equipment that is there now, and that a measurement is worth making because it can be made.

The gate is all six contingencies, in all three columns, and the re-rating.
"""
solution_explanation = """
solution/solve.py is the reference; solution/solve.sh runs it in the agent's environment. It uses only the records in /app/data.

1. **The booking.** Two of the crew's six tests reach a graded value and the other four cannot, so the orders are `tip-backpressure` and `pump-shutoff`. The tip's coefficient enters every pressure and is on no record; P-401's present shutoff decides whether its blocked discharge is credible at all, so which devices discharge on a loss of air. The reference places both orders itself before it reads anything the crew wrote.
2. **The device as it stands.** The set pressure is the one the shop record of the last work leaves, not the register's: PSV-403 was reset in situ to 29.5 barg against the register's 31.0, and PSV-409 to 9.5 against 11.0.
3. **What the contingency reaches.** The drive schedule gives the supply and the cooling medium of each driven item, so loss of power takes the cooling from both columns and, because the air compressor now stands on the normal supply, also puts the air-failure valves into the power case. The control valve data give each valve's position on a loss of air. The fire zone schedule gives the items in each zone.
4. **Credit for instrumented protection.** A cause is set aside only where a function prevents it, is SIL 2 or better, is proof tested at not more than 18 months, initiates on a measurement other than the one the failing control uses, and still has the supply the drive schedule shows. One of the four qualifies.
5. **The feed.** FE-4011's flow computer holds a fixed relative density, so the true flow is the indication times the square root of the ratio of the current relative density to the one it holds. The current molar mass comes from the most recent analysis and the published component masses. Every other meter is a coriolis meter and is read as it stands.
6. **The control valves.** For each logged point of a valve's trend the standard's compressible expression gives the coefficient at that travel; the equal percentage characteristic and the data sheet rangeability refer it to full travel, and the record's mean is used. PV-4001's flow column is FE-4011's, so it takes the feed correction first.
7. **The reboilers.** For each day of the operating record the steam flow gives the duty, a kilogram of steam delivering its latent heat at the steam pressure plus the sub-cooling of the condensate to the temperature the exchanger data says it leaves at; the duty over the difference between the steam saturation temperature and the bottoms temperature gives the coefficient-area, and the mean is used. The relieving rate uses the supply header pressure with the steam valve wide open, the bottoms temperature at the relieving pressure, and the latent heat of the bottoms liquid.
8. **The rates.** Fire gives the absorbed heat from the wetted area below 7.6 m, the level being the transmitter's indication corrected to the density of the liquid the vessel actually holds, the environment factor from a certified fire-resistant system where there is one, and the vapour from the latent heat of the liquid held; a control valve failure gives the flow the valve passes at full travel from its source pressure to the relieving pressure; a loss of cooling gives the vapour the reboiler makes; a blocked discharge gives what the pump delivers at the head the relieving pressure needs, or nothing where it cannot reach it.
9. **The header, and the sweep that closes it.** The load is the sum of the rates, and what arrives is their mixture: molar mass from the total mass over the total moles, the ratio of specific heats, compressibility and temperature mass-weighted. The tip carries the whole load and gives the pressure at the stack base. Then each length of header between two tie-ins is taken in turn, from the stack base outwards, carrying only the devices that tie in beyond it and their mixture, with the density at the pressure already reached at its downstream end; the pressure reached at a tie-in is what the devices there stand against. The pressure at the blinded end is the answer. One tie-in is the isometrics' overtaken by a later modification; a length that carries nothing adds nothing. Because step 1 needs those pressures and they need these rates, the whole contingency is swept from no built-up pressure until no tie-in moves by more than 0.0001 bar, which takes between two and eight passes.
10. **The re-rating.** For each bore the vendor supplies, from the smallest up, the six contingencies are brought out again as their own systems with that tip, and the largest share of its own set pressure left on any conventional device is compared with the 5 per cent limit. The first bore that meets it is the answer, with the device left binding at it and that share.

**On the shipped records** (authoring/evidence/reference_run.txt) the sweeps settle in 2 to 8 passes, and the same device relieves at different rates under different contingencies because it stands against a different back pressure in each: PSV-401 passes 21155 kg/h under a loss of power and 24668 kg/h under a loss of air alone. The reference identifies PV-4001 at 54.92 against a data sheet 64.0, PV-4071 at 37.76 against 44.0, PV-4021 at 3.09 against 3.60, and PV-4031 and PV-4061 within half a per cent of their sheets; E-403 at 26.73 kW/K and E-406 at 42.73 kW/K, 18.1 per cent above their data sheet basis; the feed 3.9 per cent above FE-4011's indication; P-401's shutoff head 7.7 per cent below its data sheet, which is what puts the blocked discharge out of reach; PSV-403's set pressure 4.8 per cent and PSV-409's 13.6 per cent below the register; PSV-407's tie-in 114 m further out than the isometrics show; T-402's wetted area 10.6 per cent below what the data book elevation would give; and V-405's 8.4 per cent above what its transmitter indicates. Its answer is power failure 95490 kg/h at 1.2260 barg, cooling water failure 54669 at 0.4931, instrument air failure 43661 at 0.3320, fire zone A 19967 at 0.0524, fire zone B 518 at effectively zero, fire zone C 39965 at 0.1360, and a tip of 406.4 mm with PSV-409 left binding at 4.44 per cent of its set pressure. All seven parts stand, the worst relative departure from the sealed definition being 0.0008 on a load and 0.0023 on a pressure.

**authoring/evidence/independent.py** is a second study, written separately, sharing no code with the reference. It reads the records with pandas, builds one table of every device and contingency pair and groups it, and marches the header with numpy. It takes its own choices where the standard leaves room: the control valve coefficient by a least squares fit through the origin, the reboiler coefficient-area by a least squares fit of duty against temperature difference, and the pump curve by a least squares quadratic. It sweeps each contingency to settlement in its own way and searches the bores for itself. It gets all seven parts on the shipped records and on all 20 laboratory seeds, its worst relative departure being 0.0011 on a load and 0.0027 on a pressure.
"""
verification_explanation = """
The deliverable is two CSV files. /app/output/flare_load.csv carries the devices that discharge, the load in kg/h and the pressure at the header's inlet in barg for each of the six contingencies; /app/output/tip_sizing.csv carries one row with the re-rated tip bore, the conventional device left binding at it and that device's share of its own set pressure. The verifier (tests/grade_flare.py, run by tests/test_flare.py under pytest) grades both against the sealed definition in tests/sealed:

- the set of devices must be exactly the set that discharges, in any order and separated by semicolons, spaces or commas;
- the load must be within 1 per cent of it, relative;
- the pressure must be within 1 per cent of it, relative, or below 0.002 barg where the sealed pressure is below that floor, which one fire case is.

The agent also has a booking of two field tests from the six the crew offers, ordered through a `fieldtest` wrapper before any result is known. The crew runs as a user of its own, charges the booking before it runs a test, refuses a test it has already run, and writes its reports where the agent can read but not write; the sealed definition it works from sits in a directory the agent cannot open.

For the re-rating the bore must be the right one and the binding device named exactly, with its share within 1 per cent, relative. The study is accepted only when all six rows and the re-rating stand, seven parts in all. One pytest test carries the reward. test.sh writes 0 first, and writes 1 only when pytest exits 0 and the ctrf report shows exactly 1 test, 1 passed.

The truth comes from the sealed definition authoring/provenance/isim.py, never from running the reference, and the agent never sees it: the task is records only, so no copy of it is anywhere in the agent's environment. authoring/provenance/tune.py recomputes the design rules from it and checks them: that every contingency puts at least one device on the header, that no two contingencies name the same devices, that every device discharges somewhere bar the one the pump screen removes, that fire, loss of cooling and control valve failure all arise, that the governing load is at least ten times the smallest (192 times), that exactly one row sits below the pressure floor and every other stands at least ten times clear of it, that the governing contingency passes the 1.0 barg the 2019 study called the end of the margin (1.2274 barg), and that every identified quantity either differs from its data sheet by at least 2 per cent or matches within 1 per cent. Four more cover the coupling and the re-rating: that the sweeps close on one answer (worst step ratio 0.106) and close quickly (8 passes at worst), that a sequential reading misses at least two contingencies (it misses three), that the chosen bore clears the 5 per cent limit with room (4.45 per cent) while the bore below it misses with room (5.96 per cent), and that the device left binding carries no bellows.

authoring/evidence/booking_study.txt grades every way the booking could be spent. Only `tip-backpressure` with `pump-shutoff` gets all six rows; every one of the other fourteen pairs gets at most five, and a study made with no test at all gets one. The four tests that reach no row are shown to reach none by getting the same count with and without them.

tune.py also measures what each layer of the study is worth, by setting the sealed state back to what the records would say if that layer were missed and recomputing the six rows. Against a band of 1 per cent: the column re-set 0.90 m higher 6.6 per cent, the tie-in moved after the isometrics 10.4 per cent, the two valves reset in situ 4.3 per cent, the fire-resistant insulation 3271 per cent, the feed meter's stale density 4.3 per cent, the control valve coefficients 29.4 per cent, the reboiler coefficient-area 25.7 per cent, the condensate's sub-cooling 21.7 per cent, the mis-ranged level transmitter 5.7 per cent, the tip measured rather than taken from the 2019 study 9.0 per cent, the system brought together rather than taken in sequence 8.1 per cent, and three layers that change the device set outright: the air compressor's supply, the safety system's supply, and the pump taken from the record rather than measured. No layer is worth less than the tolerance.

Two further rules cover the booking: that the tip now installed differs from the one the 2019 study worked to by more than the tolerance (16.1 per cent), and that the pump's recorded shutoff and its present one fall either side of the head section 7 screens on (582.0 m on record, 577.3 m needed, 545.0 m now), so that an assessment made on the record carries a device that does not discharge.

The seed (7301) drives only the scatter of the records; every answer comes from the parameters in the sealed definition. authoring/provenance/seed_screen.py screens seeds on three conditions (authoring/evidence/seed_screen.txt): every sound variation gets all six rows, every defective route fails, and the worst relative departure of any sound variation is within half the band. 19 of the 20 screened seeds are acceptable, the shipped one among them.

Why the gate is all six, measured on the shipped records. Every number below is copied from the named file in authoring/evidence.

Correct methods (method_spread.txt, independent.txt). The reference and seven sound variations all get 6 of 6 on the shipped records and on all 20 laboratory seeds:
- the trend fitted by least squares through the origin, or from the points above 60 per cent travel only;
- the reboiler coefficient-area from the record's mean duty over its mean temperature difference;
- the pump curve by least squares on all four points of the latest test;
- and three combinations of these.

Their worst relative departure is 0.0015 on a load and 0.0036 on a pressure, against a band of 0.0100, the pressure figure including the 0.11 per cent by which a five point back pressure test recovers the tip's coefficient. Three readings the standard does not sanction, which the tolerance nevertheless absorbs, are reported in the same file: taking every length with the whole mixture's properties, stopping the sweeps after one correction rather than at settlement, and taking every conventional device against the blinded end rather than its own tie-in. The last two are absorbed because the sweeps contract at about a tenth of the gap each pass and the conventional devices happen to tie in far out, where the header pressure is close to the inlet; neither is the reading the standard gives. 

Defective routes (route_study.txt; the last column counts the laboratory seeds 7301 to 7320 on which the route gets all six). Every one of the 31 fails on the shipped records and on every seed, and so does the 2019 study taken as the answer:
