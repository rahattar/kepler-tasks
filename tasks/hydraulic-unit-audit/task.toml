conflicts_of_interest = "I am employed by MEMC (GlobalWafers), a silicon wafer manufacturer; this task has no connection to my employer's products, processes or data. It uses only textbook fluid power (fixed-displacement pumps and their efficiency tables, induction-motor slip, bladder accumulators and the gas law, unloading valves) on synthetic presses and logs. I also author evaluation tasks for other AI benchmark programs; this task shares no data, code or scenario with them."
