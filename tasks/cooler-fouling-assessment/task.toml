conflicts_of_interest = "I am employed by MEMC (GlobalWafers), a silicon wafer manufacturer; this task has no connection to my employer's products, processes or data. It uses only textbook heat-exchanger rating (overall coefficient, LMTD, film-coefficient scaling) and a synthetic cooler bank, records, trends and parameters. I also author evaluation tasks for other AI benchmark programs; this task shares no data, code or scenario with them."
