[task]
name = "afterquery/shrink-fit-hubs"
description = "Specify the mean diametral interference and the oven temperature for each of twelve hubs shrink-fitted back onto their shafts after an overhaul (steel, ductile iron, bronze and aluminium hubs, 45 to 220 mm, dry, oiled or pasted, solid and hollow shafts), so that every joint meets the plant's standard for torque, hub stress and assembly at rest and in steady running, using a joint laboratory with a booking of 8 tests, the joint records, the thermography and the maintenance log."
authors = [{ name = "Alireza Bafandeh", email = "rahattar@gmail.com" }]
