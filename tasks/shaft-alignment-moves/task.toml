Every train is missed by at least 9 of the routes.

**Hedging** (hedge_study.txt). The sheet takes one figure for a move, so the only hedge is a figure midway between two readings. A sheet midway between the reference and each defective route was graded. One is accepted, the one for bar set 2 taken at every span, whose own worst miss is 0.086 mm; every reading that bears on the programme or on the revamp is too far from the reference for its midpoint to stand.

**Null answers** (null_baselines.txt). A sheet of constants, swept across the whole range of the sealed moves in steps of a tenth of the acceptance, aligns no train; one train's sealed moves written for every train align that train only; tune.txt shows no train's sealed moves align any other. The unit as the 2019 survey and the 2023 hot checks describe it, with no visit, aligns 8: the compressors, the fans and the three utility pumps the revamp did not reach, each of which still needs its dial sheet reduced and its running position worked out.

**Malformed sheets** (verifier_checks.txt, 50 cases, none unexpected, every sheet built from the reference at run time). Refused: no file, a symbolic link, a directory, an empty file, the header alone, no header, a misspelt, padded or capitalised header, an empty line above the header, an extra column, a row of the wrong length, a train left out, given twice, unknown or in lower case, and a move with two, four or no decimals, in exponent form, with a decimal comma, with its unit, as two figures, empty, nan, inf or not ASCII, and a sheet over the size cap. Accepted: the reference with CRLF line ends, no final terminator, empty lines between rows, the rows reversed, padded or quoted fields, a plus sign, and no digit before the point. A train moved 0.040 mm off at both planes is still accepted and one moved 0.070 mm is not. The same file runs tests/test.sh for real with pytest replaced by a stand-in: the reward is 1 only when pytest exits 0 and the report counts one test, passed, and is 0 for two tests, a skipped test, a failing exit with a passing report, no report, and a report that is not JSON.

The agent works as a separate user that can write only to /app/output. /app/data is read-only and root-owned. The verifier runs in a separate container without network, and /logs/verifier is root-only.
"""

