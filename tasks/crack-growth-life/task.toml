description = "Set a re-inspection interval for each of sixteen weld-toe fatigue cracks in the booms and towers of two ship unloaders, between 40 and 50 percent of its remaining life, using five crack growth test slots in a materials laboratory, the plant's records, two earlier cracks and BS 7910."
